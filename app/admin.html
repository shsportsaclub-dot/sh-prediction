<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>SH PREDICTION · Admin</title>
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<style>
:root{--bg:#050b18;--surface:#0d1830;--surface2:#13213d;--line:#22345a;--text:#eef3ff;--muted:#9fb0cc;--red:#d01934;--blue:#2366d6;
 --home:#3b8bff;--away:#ff8a1f;--win:#22c55e;--lose:#ef4444;--unknown:#8a94a6;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--surface);border-bottom:3px solid;border-image:linear-gradient(90deg,var(--red),var(--blue)) 1}
header img{width:30px;height:30px}header h1{font-size:15px;letter-spacing:.1em;margin:0;flex:1}
nav{display:flex;gap:6px;overflow-x:auto;padding:8px 12px;background:var(--surface);border-bottom:1px solid var(--line);scrollbar-width:none}
nav a{color:var(--muted);text-decoration:none;padding:7px 11px;border-radius:9px;white-space:nowrap}nav a.on{background:linear-gradient(100deg,var(--red),var(--blue));color:#fff}
main{max-width:1100px;margin:auto;padding:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0}
h2{font-size:18px;margin:6px 0}h3{font-size:14px;margin:0 0 8px}
.muted{color:var(--muted);font-size:12.5px}
input,select,textarea,button{font:inherit;border:1px solid var(--line);background:var(--surface2);color:var(--text);border-radius:9px;padding:9px}
button{cursor:pointer}button.p{background:var(--blue);border-color:transparent}button.d{background:#5b1420}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px;align-items:end}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.tw{overflow:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;vertical-align:top}th{color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;position:sticky;top:0;background:var(--surface)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}.stat{background:var(--surface2);border-radius:10px;padding:10px}.stat b{display:block;font-size:20px}
#msg{position:sticky;top:0;z-index:3;padding:8px 12px;border-radius:9px;display:none;margin:8px 0}#msg.ok{display:block;background:#124d2c}#msg.err{display:block;background:#6b1621}
/* Master List: approved 5-column format, font colours only */
table.ml td{font-weight:700;font-size:15px}.p-H,.c-home{color:var(--home)}.p-A,.c-away{color:var(--away)}.o-won{color:var(--win)}.o-lost{color:var(--lose)}.o-unknown{color:var(--unknown)}
pre{white-space:pre-wrap;font-size:12px;margin:0;max-width:520px}
.tag{font-size:11px;padding:2px 6px;border-radius:5px;background:var(--surface2);color:var(--muted)}.tag.demo{background:#5b2a86;color:#fff}
</style>
</head>
<body>
<header><img src="/sh-prediction-icon.png" alt=""><h1>SH PREDICTION · ADMIN</h1><button id="lock" hidden>Lock</button></header>
<nav id="nav" aria-label="Admin sections"></nav>
<main><div id="msg" role="status"></div><div id="view"></div></main>
<script>
"use strict";
const SECTIONS=[["dashboard","Dashboard"],["master","Master List"],["matches","Match Management"],["results","Result Verification"],["predictions","Predictions"],["experts","Experts"],["import","Data Import"],["providers","Data Providers"],["accuracy","Accuracy Reports"],["audit","Audit Logs"],["roles","Roles & Permissions"],["settings","Settings"]];
let KEY=(()=>{try{return sessionStorage.getItem("shp_admin")||""}catch(e){return ""}})();
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const when=u=>{const d=new Date(u);return isNaN(d)?"—":d.toLocaleString()};
async function api(path,body){const o={headers:{"Content-Type":"application/json","X-Admin-Token":KEY}};if(body!==undefined){o.method="POST";o.body=JSON.stringify(body)}
 const r=await fetch("/api/v1"+path,o);const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error((j.error&&j.error.message)||("HTTP "+r.status));return j}
function msg(t,ok){const m=$("#msg");m.textContent=t;m.className=ok?"ok":"err";clearTimeout(msg.t);msg.t=setTimeout(()=>m.className="",5000)}
async function act(fn,ok){try{const r=await fn();msg(ok||"Done",true);return r}catch(e){msg(e.message,false)}}
const field=(id,label,type,opts)=>'<label>'+esc(label)+(type==="select"?'<select id="'+id+'">'+opts+'</select>':type==="area"?'<textarea id="'+id+'" rows="6"></textarea>':'<input id="'+id+'" '+(type?'type="'+type+'"':'')+(opts?' placeholder="'+esc(opts)+'"':'')+'>')+'</label>';
const val=id=>{const e=$("#"+id);return e?e.value.trim():""};
const table=(cols,rows)=>rows.length?'<div class="tw"><table><thead><tr>'+cols.map(c=>'<th>'+esc(c[1])+'</th>').join("")+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+cols.map(c=>'<td>'+(c[2]?c[2](r):esc(r[c[0]]??"—"))+'</td>').join("")+'</tr>').join("")+'</tbody></table></div>':'<p class="muted">No records.</p>';
let MATCHES=[];
async function loadMatches(){const [a,b,c]=await Promise.all(["upcoming","live","completed"].map(s=>api("/matches?status="+s+"&limit=100")));MATCHES=[...b.items,...a.items,...c.items];return MATCHES}
const mOpts=()=>'<option value="">Select match</option>'+MATCHES.map(m=>'<option value="'+m.id+'">#'+m.id+' '+esc(m.home.name)+' vs '+esc(m.away.name)+' · '+esc(m.start_utc.slice(0,16))+'</option>').join("");
const teamOpts=mid=>{const m=MATCHES.find(x=>x.id==mid);return m?'<option value="'+m.home.id+'">H · '+esc(m.home.name)+'</option><option value="'+m.away.id+'">A · '+esc(m.away.name)+'</option>':'<option value="">Select match first</option>'};
function bindTeams(sel,targets){$("#"+sel).onchange=()=>targets.forEach(t=>$("#"+t).innerHTML=teamOpts(val(sel)))}
function mcell(v){if(!v)return '<span class="o-unknown">—</span>';return '<span class="p-'+v.side+'">'+v.side+'-</span><span class="o-'+v.outcome+'">'+esc(v.code||v.name)+'</span>'}

const V={
async dashboard(el){const d=await api("/admin/dashboard");const s=(v,l)=>'<div class="stat"><b>'+esc(v)+'</b><span class="muted">'+esc(l)+'</span></div>';
 el.innerHTML='<h2>Dashboard</h2>'+(d.pending_migrations.length?'<div class="card" style="border-color:#b97a00"><b>Database migration pending:</b> '+esc(d.pending_migrations.join(", "))+' — open Settings → Database.</div>':'')+
 '<div class="card"><div class="stats">'+s(d.matches.scheduled,"Scheduled")+s(d.matches.live,"Live")+s(d.matches.awaiting_result,"Awaiting result")+s(d.matches.completed,"Completed")+s(d.predictions.drafts,"Draft predictions")+s(d.predictions.locked_unpublished,"Locked, not published")+s(d.predictions.published,"Published")+s(d.experts.unverified,"Experts to verify")+s(d.users,"Users")+s(d.accuracy.accuracy==null?"—":d.accuracy.accuracy+"%","Accuracy (all locked)")+'</div></div>'+
 '<div class="card"><h3>Data providers</h3>'+table([["name","Provider"],["kind","Kind"],["enabled","Enabled",r=>r.enabled?"yes":"no"],["last_status","Last sync"],["last_sync_at","When",r=>when(r.last_sync_at)]],d.providers)+'</div>'},
async master(el){const comps=await api("/competitions");
 el.innerHTML='<h2>Master List</h2><p class="muted">Actual results master (not predictions). Toss: toss winner — green if it went on to win the match, red if it lost, grey while there is no result. Winner: match winner in green, grey — when unknown.</p><div class="form">'+field("mc","Competition","select",'<option value="">All</option>'+comps.items.map(c=>'<option value="'+c.id+'">'+esc(c.name)+'</option>').join(""))+field("mds","Dataset","select",'<option value="verified">Verified</option><option value="demo">Demo</option>')+'</div><div id="mlt"></div>';
 const go=async()=>{const j=await api("/admin/master-list?dataset="+val("mds")+(val("mc")?"&competition_id="+val("mc"):""));
  $("#mlt").innerHTML=(j.dataset==="demo"?'<p><span class="tag demo">DEMO DATA</span></p>':'')+(j.items.length?'<div class="tw"><table class="ml"><thead><tr>'+j.columns.map(c=>'<th>'+esc(c)+'</th>').join("")+'</tr></thead><tbody>'+j.items.map(r=>'<tr><td>'+esc(r.match)+'</td><td class="c-home">'+esc(r.home.code||r.home.name)+'</td><td class="c-away">'+esc(r.away.code||r.away.name)+'</td><td>'+mcell(r.toss)+'</td><td>'+mcell(r.winner)+'</td></tr>').join("")+'</tbody></table></div>':'<p class="muted">No matches.</p>')};
 $("#mc").onchange=go;$("#mds").onchange=go;await go()},
async matches(el){await loadMatches();
 el.innerHTML='<h2>Match Management</h2><div class="card"><h3>Create match</h3><div class="form">'+field("c_comp","Competition")+field("c_season","Season")+field("c_no","Match no")+field("c_home","Home team")+field("c_away","Away team")+field("c_start","Start (local)","datetime-local")+field("c_venue","Venue")+field("c_fmt","Format","select",["T20","T10","The Hundred","ODI","List A","Test","First-class","Other"].map(f=>'<option>'+f+'</option>').join(""))+field("c_src","Source (required)")+'<button class="p" id="c_go">Create</button></div></div>'+
 '<div class="card"><h3>Edit match</h3><div class="form">'+field("e_m","Match","select",mOpts())+field("e_weather","Weather")+field("e_pitch","Pitch report")+field("e_venue","Venue")+field("e_start","New start (local)","datetime-local")+field("e_reason","Reason (needed to move start)")+'<button class="p" id="e_go">Save changes</button></div></div>'+
 '<div class="card"><h3>Team short code (shown in Master List)</h3><div class="form">'+field("t_name","Team name (exact)")+field("t_code","Short code","", "e.g. UB")+'<button class="p" id="t_go">Approve code</button></div></div>'+
 '<div class="card"><h3>Players, squads and Playing XI</h3><div class="form">'+field("p_name","Player name")+field("p_role","Role","select",'<option value="batter">Batter</option><option value="bowler">Bowler</option><option value="all_rounder">All-rounder</option><option value="wicket_keeper">Wicket-keeper</option>')+'<button class="p" id="p_go">Add player</button></div><p class="muted" id="p_out"></p>'+
 '<div class="form">'+field("l_m","Match","select",mOpts())+field("l_t","Team","select",teamOpts(""))+field("l_kind","List","select",'<option value="squad">Squad</option><option value="playing-xi">Playing XI</option>')+field("l_ids","Player IDs (comma separated, captain first, keeper marked *)")+'<button class="p" id="l_go">Save list</button></div></div>'+
 '<div class="card"><h3>Ball-by-ball entry (live scoring)</h3><div class="form">'+field("b_m","Match","select",mOpts())+field("b_inn","Innings","", "1")+field("b_bat","Batting team","select",teamOpts(""))+field("b_seq","Ball sequence no","", "1")+field("b_runs","Runs off bat","", "0")+field("b_ex","Extra type","select",'<option value="">None</option><option value="wide">Wide</option><option value="no_ball">No ball</option><option value="bye">Bye</option><option value="leg_bye">Leg bye</option>')+field("b_exr","Extra runs","", "0")+field("b_w","Wicket","select",'<option value="">No</option><option value="1">Yes</option>')+field("b_target","Target (2nd innings, first ball)")+'<button class="p" id="b_go">Add ball</button></div><p class="muted" id="b_out"></p></div>';
 bindTeams("l_m",["l_t"]);bindTeams("b_m",["b_bat"]);
 $("#c_go").onclick=()=>act(async()=>{const v=val("c_start");if(!v)throw Error("start time required");const r=await api("/admin/matches",{competition:val("c_comp"),season:val("c_season")||null,match_no:val("c_no")||null,home:val("c_home"),away:val("c_away"),start_utc:new Date(v).toISOString(),venue:val("c_venue")||null,format:val("c_fmt"),source:val("c_src")});return r},"Match saved (duplicates are ignored)");
 $("#e_go").onclick=()=>act(async()=>{const b={};if(val("e_weather"))b.weather=val("e_weather");if(val("e_pitch"))b.pitch_report=val("e_pitch");if(val("e_venue"))b.venue=val("e_venue");if(val("e_start")){b.start_utc=new Date(val("e_start")).toISOString();b.reason=val("e_reason")}return api("/admin/matches/"+val("e_m"),b)},"Match updated");
 $("#t_go").onclick=()=>act(()=>api("/admin/teams",{name:val("t_name"),short_code:val("t_code")}),"Short code approved");
 $("#p_go").onclick=()=>act(async()=>{const r=await api("/admin/players",{name:val("p_name"),role:val("p_role")});$("#p_out").textContent="Player ID "+r.player_id},"Player saved");
 $("#l_go").onclick=()=>act(()=>{const ids=val("l_ids").split(",").map(s=>s.trim()).filter(Boolean);return api("/admin/matches/"+val("l_m")+"/"+val("l_kind"),{team_id:+val("l_t"),players:ids.map((s,i)=>({player_id:parseInt(s),is_captain:i===0,is_keeper:s.endsWith("*")}))})},"List saved");
 $("#b_go").onclick=()=>act(async()=>{const b={match_id:+val("b_m"),innings_no:+val("b_inn")||1,batting_team_id:+val("b_bat"),seq:+val("b_seq"),runs_bat:+val("b_runs")||0,extras:+val("b_exr")||0,extra_type:val("b_ex")||null,is_wicket:val("b_w")==="1"?1:0,source:"admin scorer"};if(val("b_target"))b.target=+val("b_target");const r=await api("/admin/ball-events",b);$("#b_out").textContent="Score "+r.score+" ("+r.overs+" ov)"+(r.innings_completed?" · innings complete":"");$("#b_seq").value=+val("b_seq")+1;return r},"Ball recorded")},
async results(el){await loadMatches();
 el.innerHTML='<h2>Result Verification</h2><p class="muted">Results follow ICC playing conditions: a tie with no Super Over, no result, abandoned and canceled have no winner. Revising needs a reason and is audited; predictions are re-evaluated automatically and never edited.</p>'+
 '<div class="card"><h3>Toss</h3><div class="form">'+field("ts_m","Match","select",mOpts())+field("ts_w","Toss winner","select",teamOpts(""))+field("ts_d","Decision","select",'<option value="bat">Bat</option><option value="bowl">Bowl</option>')+field("ts_src","Source (required)")+field("ts_r","Reason (only when revising)")+'<button class="p" id="ts_go">Save toss</button></div></div>'+
 '<div class="card"><h3>Match result</h3><div class="form">'+field("rs_m","Match","select",mOpts())+field("rs_t","Result","select",'<option value="win">Win</option><option value="tie_super_over">Tie — decided by Super Over</option><option value="tie">Tie (no Super Over)</option><option value="no_result">No result</option><option value="abandoned">Abandoned</option><option value="canceled">Canceled</option><option value="awarded">Awarded</option>')+field("rs_w","Winner","select",teamOpts(""))+field("rs_margin","Margin","", "e.g. 12 runs")+field("rs_method","Method","", "e.g. DLS")+field("rs_src","Source (required)")+field("rs_r","Reason (only when revising)")+'<button class="p" id="rs_go">Save result</button></div></div>';
 bindTeams("ts_m",["ts_w"]);bindTeams("rs_m",["rs_w"]);
 $("#ts_go").onclick=()=>act(()=>api("/admin/toss",{match_id:+val("ts_m"),winner_team_id:+val("ts_w"),decision:val("ts_d"),source:val("ts_src"),reason:val("ts_r")||null}),"Toss saved");
 $("#rs_go").onclick=()=>act(()=>{const t=val("rs_t");return api("/admin/results",{match_id:+val("rs_m"),result_type:t,winner_team_id:["win","tie_super_over","awarded"].includes(t)?+val("rs_w"):null,margin:val("rs_margin")||null,method:val("rs_method")||null,source:val("rs_src"),reason:val("rs_r")||null})},"Result saved and predictions evaluated")},
async predictions(el){await loadMatches();const ex=await api("/experts?limit=100");
 el.innerHTML='<h2>Predictions</h2><div class="card"><h3>Prediction entry</h3><div class="form">'+field("pr_m","Match","select",mOpts())+field("pr_x","Expert","select",ex.items.map(x=>'<option value="'+x.id+'">'+esc(x.display_name)+(x.verified?"":" (unverified)")+'</option>').join(""))+field("pr_k","Type","select",'<option value="winner">Winner</option><option value="toss">Toss</option><option value="first_innings_score">1st innings score</option><option value="second_innings_score">2nd innings score</option>')+field("pr_t","Team","select",teamOpts(""))+field("pr_v","Runs (score types)")+field("pr_c","Confidence %")+field("pr_e","Explanation")+field("pr_l","Lock now","select",'<option value="1">Yes — lock now</option><option value="0">No — save draft</option>')+'<button class="p" id="pr_go">Save</button><button id="pr_model">SH AI prediction for this match</button></div></div>'+
 '<div class="card"><h3>Prediction register</h3><div class="form">'+field("rg_f","Show","select",'<option value="">All</option><option value="draft">Drafts</option><option value="unpub">Locked, not published</option><option value="pub">Published</option>')+field("rg_ds","Dataset","select",'<option value="verified">Verified</option><option value="demo">Demo</option>')+'</div><div id="reg"></div></div>';
 bindTeams("pr_m",["pr_t"]);
 $("#pr_go").onclick=()=>act(async()=>{const k=val("pr_k"),b={match_id:+val("pr_m"),expert_id:+val("pr_x"),prediction_type:k,confidence:val("pr_c")?+val("pr_c"):null,explanation:val("pr_e")||null,lock:val("pr_l")==="1"};if(k.includes("score"))b.predicted_value=+val("pr_v");else b.predicted_team_id=+val("pr_t");const r=await api("/predictions",b);await reg();return r},"Prediction saved");
 $("#pr_model").onclick=()=>act(async()=>{const r=await api("/admin/matches/"+val("pr_m")+"/model-prediction",{});await reg();return r},"SH AI prediction locked (publish it below)");
 const reg=async()=>{const f=val("rg_f"),q="/admin/predictions?limit=100&dataset="+val("rg_ds")+(f==="draft"?"&status=draft":f==="unpub"?"&status=locked&published=0":f==="pub"?"&published=1":"");const j=await api(q);
  $("#reg").innerHTML=table([["id","ID"],["match","Match",r=>'#'+r.match_id+' '+esc(r.home)+' v '+esc(r.away)],["source_type","Source",r=>esc(r.expert||r.source_type)],["prediction_type","Type"],["predicted_team","Pick",r=>esc(r.predicted_team||r.predicted_value)],["confidence","Conf."],["status","Status"],["locked_at","Locked",r=>r.locked_at?when(r.locked_at):"—"],["evaluation","Result"],["published_at","Published",r=>r.published_at?when(r.published_at):"—"],["x","Action",r=>r.status==="draft"?'<button data-lock="'+r.id+'">Lock</button>':(r.published_at?'<button class="d" data-unpub="'+r.id+'">Unpublish</button>':'<button class="p" data-pub="'+r.id+'">Publish</button>')]],j.items)+'<p class="muted">'+j.total+' predictions. Locked predictions cannot be edited or deleted.</p>';
  document.querySelectorAll("[data-lock]").forEach(b=>b.onclick=()=>act(async()=>{await api("/admin/predictions/"+b.dataset.lock+"/lock",{});await reg()},"Locked"));
  document.querySelectorAll("[data-pub]").forEach(b=>b.onclick=()=>act(async()=>{await api("/admin/predictions/"+b.dataset.pub+"/publish",{public_note:prompt("Public note shown to viewers (optional)")||null});await reg()},"Published to viewers"));
  document.querySelectorAll("[data-unpub]").forEach(b=>b.onclick=()=>act(async()=>{const r=prompt("Reason for unpublishing (required)");if(!r)throw Error("Reason required");await api("/admin/predictions/"+b.dataset.unpub+"/unpublish",{reason:r});await reg()},"Unpublished"))};
 $("#rg_f").onchange=reg;$("#rg_ds").onchange=reg;await reg()},
async experts(el){const go=async()=>{const j=await api("/experts?limit=100");$("#xl").innerHTML=table([["id","ID"],["display_name","Name"],["country","Country"],["language_code","Lang"],["verified","Verified",r=>r.verified?"yes":"no"],["acc","Accuracy (all locked)",r=>r.accuracy.accuracy==null?"—":r.accuracy.accuracy+"% ("+r.accuracy.settled+")"],["x","",r=>'<button data-v="'+r.id+'" data-s="'+(r.verified?0:1)+'">'+(r.verified?"Remove verification":"Verify")+'</button>']],j.items);
  document.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>act(async()=>{await api("/admin/experts/"+b.dataset.v+"/verify",{verified:b.dataset.s==="1"});await go()},"Updated"))};
 el.innerHTML='<h2>Expert Management</h2><div class="card"><h3>Add expert</h3><div class="form">'+field("x_n","Display name")+field("x_p","Phone (for expert login, optional)")+field("x_c","Country")+field("x_l","Language code","", "en")+field("x_b","Bio")+field("x_u","Contact URL (https)")+'<button class="p" id="x_go">Add</button></div></div><div class="card" id="xl"></div>';
 $("#x_go").onclick=()=>act(async()=>{await api("/admin/experts",{display_name:val("x_n"),phone:val("x_p")||null,country:val("x_c")||null,language_code:val("x_l")||"en",bio:val("x_b")||null,contact_url:val("x_u")||null});await go()},"Expert added (not verified yet)");await go()},
async import(el){el.innerHTML='<h2>Data Import</h2><div class="card"><p class="muted">Paste CSV with a header row. Required: competition, home, away, start_utc (with timezone, e.g. 2026-11-08T14:00:00+04:00), source. Optional: season, match_no, venue, format, toss_winner, toss_decision, result_type, winner, margin, method. Team names in toss_winner / winner must match home or away. Always run "Check" first; nothing is saved until you press "Import".</p>'+field("csv","CSV","area")+'<p><button id="ck">Check (dry run)</button> <button class="p" id="im">Import</button></p><pre id="ir"></pre></div>';
 const run=c=>act(async()=>{const r=await api("/admin/import",{csv:$("#csv").value,commit:c});$("#ir").textContent=JSON.stringify(r,null,2);return r},c?"Imported":"Checked — nothing saved");$("#ck").onclick=()=>run(false);$("#im").onclick=()=>run(true)},
async providers(el){const go=async()=>{const j=await api("/admin/providers");
  $("#pv").innerHTML=table([["name","Provider"],["kind","Kind"],["enabled","Enabled",r=>r.enabled?"yes":"no"],["config_json","Config",r=>'<pre>'+esc(r.config_json)+'</pre>'],["last_status","Last sync",r=>esc(r.last_status||"—")+(r.last_error?'<div class="muted">'+esc(r.last_error)+'</div>':'')],["x","",r=>'<button data-t="'+r.name+'" data-e="'+(r.enabled?0:1)+'">'+(r.enabled?"Disable":"Enable")+'</button> <button data-sync="'+r.name+'">Sync now</button>']],j.items)+'<h3 style="margin-top:12px">Recent sync runs</h3>'+table([["provider","Provider"],["status","Status"],["attempts","Attempts"],["created","Created"],["duplicates","Duplicates"],["rejected","Rejected"],["started_at","Started",r=>when(r.started_at)]],j.runs);
  document.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>act(async()=>{await api("/admin/providers/"+b.dataset.t,{enabled:b.dataset.e==="1"});await go()},"Updated"));
  document.querySelectorAll("[data-sync]").forEach(b=>b.onclick=()=>act(async()=>{const r=await api("/admin/providers/"+b.dataset.sync+"/sync",{});await go();return r},"Sync finished"))};
 el.innerHTML='<h2>Data Provider Management</h2><div class="card"><p class="muted">External data enters only through these adapters. "licensed_feed" stays disabled until a licence/contract reference is recorded; API keys live only in server environment variables, never here.</p><div class="form">'+field("lf_ref","Licence / contract reference")+field("lf_vendor","Vendor name")+'<button id="lf_go">Save licensed feed details</button></div></div><div class="card" id="pv"></div>';
 $("#lf_go").onclick=()=>act(async()=>{await api("/admin/providers/licensed_feed",{config:{contract_reference:val("lf_ref"),vendor:val("lf_vendor")}});await go()},"Saved");await go()},
async accuracy(el){const [a,cal,mv]=await Promise.all([api("/admin/accuracy"),api("/admin/calibration"),api("/admin/model-versions")]);
 const tb=o=>table([["k","Group"],["accuracy","Accuracy",r=>r.accuracy==null?"—":r.accuracy+"%"],["correct","Correct"],["incorrect","Incorrect"],["pending","Pending"],["void","Void"],["ineligible","Ineligible"]],Object.entries(o).map(([k,v])=>Object.assign({k},v)));
 el.innerHTML='<h2>Accuracy Reports</h2><p class="muted">All locked predictions (published or not). '+esc(a.overall.formula)+'</p><div class="card"><h3>Overall</h3>'+tb({All:a.overall})+'</div><div class="card"><h3>By type</h3>'+tb(a.by_type)+'</div><div class="card"><h3>By league</h3>'+tb(a.by_league)+'</div><div class="card"><h3>By expert</h3>'+tb(a.by_expert)+'</div><div class="card"><h3>By model</h3>'+tb(a.by_model)+'</div>'+
 '<div class="card"><h3>Calibration (walk-forward backtest, SH AI)</h3>'+(cal.matches_evaluated?'<p>Matches: <b>'+cal.matches_evaluated+'</b> · Brier: <b>'+cal.brier_score+'</b> (coin flip = 0.25) · Log loss: <b>'+cal.log_loss+'</b> · Hit rate: <b>'+cal.hit_rate+'%</b></p>'+table([["range","Predicted range"],["matches","Matches"],["mean_predicted","Mean predicted %"],["observed_home_win","Observed home win %"]],cal.reliability):'')+'<p class="muted">'+esc(cal.note)+'</p></div>'+
 '<div class="card"><h3>Model versions (admin only — weights are never shown to viewers)</h3>'+table([["id","ID"],["version","Version"],["description","Description"],["params","Weights",r=>'<pre>'+esc(JSON.stringify(r.params))+'</pre>'],["created_at","Created",r=>when(r.created_at)]],mv.items)+'<div class="form" style="margin-top:8px">'+field("mv_v","New version","", "e.g. 1.1.0")+field("mv_p","Weights JSON","", '{"form_window":10,...}')+'<button class="p" id="mv_go">Activate new version</button></div></div>';
 $("#mv_go").onclick=()=>act(async()=>{await api("/admin/model-versions",{version:val("mv_v"),params:JSON.parse(val("mv_p"))});V.accuracy(el)},"New model version active")},
async audit(el){let off=0;const go=async()=>{const j=await api("/admin/audit?limit=50&offset="+off);$("#al").innerHTML=table([["id","ID"],["created_at","When",r=>when(r.created_at)],["actor","Actor"],["action","Action"],["entity","Entity",r=>esc((r.entity||"")+" "+(r.entity_id||""))],["payload","Payload",r=>'<pre>'+esc(r.payload)+'</pre>'],["old_value","Before",r=>'<pre>'+esc(r.old_value||"")+'</pre>']],j.items)+'<p><button id="ap"'+(off?"":" disabled")+'>Newer</button> <button id="an"'+(off+50<j.total?"":" disabled")+'>Older</button> <span class="muted">'+j.total+' entries</span></p>';
  $("#ap").onclick=()=>{off=Math.max(0,off-50);go()};$("#an").onclick=()=>{off+=50;go()}};el.innerHTML='<h2>Audit Logs</h2><div class="card" id="al"></div>';await go()},
async roles(el){const go=async()=>{const j=await api("/admin/users?limit=100");$("#ul").innerHTML='<p class="muted">'+esc(j.note)+'</p>'+table([["id","ID"],["phone_masked","Phone"],["role","Role"],["expert_id","Expert profile"],["created_at","Joined",r=>when(r.created_at)],["x","",r=>'<select data-u="'+r.id+'"><option'+(r.role==="user"?" selected":"")+'>user</option><option'+(r.role==="expert"?" selected":"")+'>expert</option></select>']],j.items);
  document.querySelectorAll("[data-u]").forEach(s=>s.onchange=()=>act(()=>api("/admin/users/"+s.dataset.u+"/role",{role:s.value}),"Role updated"))};el.innerHTML='<h2>Roles & Permissions</h2><div class="card"><p class="muted">Viewer: public pages only. User: + saved preferences and follows. Expert: + submit predictions (private until an admin publishes). Admin: everything here, only with the admin key.</p></div><div class="card" id="ul"></div>';await go()},
async settings(el){const [s,sys,fr]=await Promise.all([api("/admin/settings"),api("/admin/system/status"),api("/admin/fantasy/rules")]);
 el.innerHTML='<h2>Settings</h2><div class="card"><h3>System settings</h3>'+table([["key","Key"],["value","Value"],["updated_by","Updated by"],["updated_at","When",r=>when(r.updated_at)]],s.items)+'<div class="form" style="margin-top:8px">'+field("st_k","Setting","select",s.items.map(i=>'<option>'+esc(i.key)+'</option>').join(""))+field("st_v","New value")+'<button class="p" id="st_go">Save</button></div></div>'+
 '<div class="card"><h3>Database</h3><p>Pending migrations: <b>'+esc(sys.pending.join(", ")||"none")+'</b></p><p class="muted">Running a migration first copies the database to a backup file and checks it; the migration only starts if the backup is complete.</p>'+(sys.pending.length?'<button class="p" id="mg">Back up and run migration</button>':'')+'<h3 style="margin-top:10px">Backups</h3><pre>'+esc(sys.backups.join("\n")||"none")+'</pre></div>'+
 '<div class="card"><h3>Fantasy rule sets</h3>'+table([["name","Name"],["rules","Rules",r=>'<pre>'+esc(JSON.stringify(r.rules))+'</pre>']],fr.items)+'<div class="form">'+field("fr_n","Rule set name")+field("fr_r","Rules JSON")+'<button class="p" id="fr_go">Save rule set</button></div></div>';
 $("#st_go").onclick=()=>act(async()=>{await api("/admin/settings",{[val("st_k")]:val("st_v")});V.settings(el)},"Setting saved");
 $("#fr_go").onclick=()=>act(async()=>{await api("/admin/fantasy/rules",{name:val("fr_n"),rules:JSON.parse(val("fr_r"))});V.settings(el)},"Rule set saved");
 if($("#mg"))$("#mg").onclick=()=>act(async()=>{if(!confirm("Back up the database and apply pending migrations?"))throw Error("Cancelled");const r=await api("/admin/system/migrate",{confirm:true});alert(JSON.stringify(r,null,2));V.settings(el)},"Migration finished")}
};
function login(){$("#nav").innerHTML="";$("#lock").hidden=true;
 $("#view").innerHTML='<div class="card" style="max-width:420px;margin:40px auto"><h2>Admin sign-in</h2><p class="muted">The admin key is kept only while this tab is open. It is never saved on the device.</p><input id="k" type="password" autocomplete="off" style="width:100%" aria-label="Admin key"><p><button class="p" id="kgo">Unlock</button></p></div>';
 $("#kgo").onclick=async()=>{KEY=$("#k").value.trim();try{await api("/admin/system/status");try{sessionStorage.setItem("shp_admin",KEY)}catch(e){}route()}catch(e){KEY="";msg("Wrong admin key",false)}}}
async function route(){if(!KEY)return login();$("#lock").hidden=false;
 let sys;try{sys=await api("/admin/system/status")}catch(e){KEY="";return login()}
 let sec=(location.hash||"#dashboard").slice(1);if(sys.pending.length)sec="settings";if(!V[sec])sec="dashboard";
 $("#nav").innerHTML=SECTIONS.map(([k,l])=>'<a href="#'+k+'" class="'+(k===sec?"on":"")+'">'+esc(l)+'</a>').join("");
 const el=$("#view");el.innerHTML='<p class="muted">Loading…</p>';
 if(sys.pending.length&&sec==="settings"){el.innerHTML='<h2>Database migration needed</h2><div class="card"><p>Pending: <b>'+esc(sys.pending.join(", "))+'</b></p><p class="muted">A verified backup is taken first. Existing data (fixtures, predictions, outcomes) is kept and checked after the migration.</p><button class="p" id="mg">Back up and run migration</button><pre id="mr"></pre></div>';
  $("#mg").onclick=()=>act(async()=>{const r=await api("/admin/system/migrate",{confirm:true});$("#mr").textContent=JSON.stringify(r,null,2);setTimeout(route,1500);return r},"Migration finished");return}
 try{await V[sec](el)}catch(e){el.innerHTML='<div class="card">Could not load: '+esc(e.message)+' <button id="rt">Retry</button></div>';$("#rt").onclick=route}}
$("#lock").onclick=()=>{KEY="";try{sessionStorage.removeItem("shp_admin")}catch(e){}login()};
window.addEventListener("hashchange",route);route();
</script>
</body>
