<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#03050c"><title>SH PREDICTION — Welcome</title><style>:root{--red:#e3122d;--blue:#3ab0ff;--gold:#ffc61a;--bg1:#03050c;--bg2:#070b18}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:var(--bg1);color:white;font-family:system-ui,Arial,sans-serif}#splash{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:space-between;align-items:center;text-align:center;overflow:hidden;isolation:isolate;padding:calc(18px + env(safe-area-inset-top)) 18px calc(26px + env(safe-area-inset-bottom));background:linear-gradient(160deg,var(--bg1),var(--bg2) 55%,#04060d);transition:opacity .4s}#splash.leaving{opacity:0;pointer-events:none}.glows{position:absolute;inset:-12%;z-index:-3;pointer-events:none;background:radial-gradient(ellipse at 25% 70%,#e3122d55,transparent 43%),radial-gradient(ellipse at 80% 62%,#1a6dff44,transparent 45%);animation:drift 7s ease-in-out infinite alternate}@keyframes drift{to{transform:translate(4%,-3%) scale(1.08)}}.vignette{position:absolute;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(ellipse at center,transparent 28%,#0006)}.streak{position:absolute;left:0;width:38vw;height:2px;z-index:-1;opacity:0;background:linear-gradient(90deg,transparent,#fffa,transparent);animation:fly 2.6s ease-in infinite}.streak:nth-child(2){top:20%}.streak:nth-child(3){top:38%;animation-delay:.7s}.streak:nth-child(4){top:62%;animation-delay:1.3s}.streak:nth-child(5){top:80%;animation-delay:.3s}@keyframes fly{0%{opacity:0;transform:translateX(-120vw)}30%,70%{opacity:.65}100%{opacity:0;transform:translateX(120vw)}}.top{width:100%;display:flex;justify-content:flex-end}#skip{padding:8px 14px;border-radius:20px;border:1px solid #ffffff33;background:#0b1224aa;color:white;font-size:12px;font-weight:800;cursor:pointer}.center{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;min-height:0}.logo-box{position:relative;width:min(84vw,360px,42vh);aspect-ratio:1;display:grid;place-items:center}.entrance{width:100%;height:100%;display:grid;place-items:center;opacity:0;animation:appear 1.1s .15s cubic-bezier(.2,1.3,.4,1) forwards}.float{animation:float 4s ease-in-out 1.3s infinite}.shape{width:min(62vw,300px,33vh);aspect-ratio:1;position:relative;filter:drop-shadow(0 10px 30px #e3122d66)}#logo{display:block;width:100%;height:100%;object-fit:contain}.sheen{position:absolute;inset:0;pointer-events:none;background:linear-gradient(105deg,transparent 35%,#ffffffcc 50%,transparent 65%);background-size:250% 100%;-webkit-mask-image:var(--mask);mask-image:var(--mask);-webkit-mask-size:contain;mask-size:contain;-webkit-mask-position:center;mask-position:center;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;animation:sheen 2.6s ease-in-out 1.2s infinite}@keyframes appear{0%{opacity:0;transform:scale(.25) rotate(-18deg);filter:blur(8px)}60%{opacity:1;filter:blur(0)}100%{opacity:1;transform:scale(1) rotate(0);filter:blur(0)}}@keyframes float{50%{transform:translateY(-8px)}}@keyframes sheen{from{background-position:150% center}to{background-position:-150% center}}.sparkle{position:absolute;width:var(--size);height:var(--size);border-radius:50%;background:var(--color);box-shadow:0 0 9px var(--color);animation:twinkle 1.6s ease-in-out var(--delay) infinite;opacity:0}@keyframes twinkle{50%{opacity:1;transform:scale(1)}0%,100%{opacity:0;transform:scale(0)}}.title{display:flex;flex-direction:column;align-items:center;font:italic 900 clamp(40px,14vw,70px)/.92 Impact,"Arial Narrow",system-ui,sans-serif;transform:skewX(-6deg);text-transform:uppercase}.title span{opacity:0}.sh{background:linear-gradient(180deg,#fff,#9aa3b8 60%,#e8ecf6);-webkit-background-clip:text;background-clip:text;color:#dfe5f5;-webkit-text-fill-color:transparent;width:fit-content;padding:0 .1em;animation:left .7s ease-out .5s forwards}.prediction{width:fit-content;-webkit-text-fill-color:transparent;font-size:.72em;margin-top:5px;padding-bottom:.15em;background:linear-gradient(180deg,#ff5468,var(--red) 60%,#8f0a1d);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 14px #e3122d77);animation:right .7s ease-out .8s forwards}@keyframes left{from{opacity:0;transform:translateX(-40px)}to{opacity:1;transform:translateX(0)}}@keyframes right{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:translateX(0)}}.bottom{width:100%;display:flex;flex-direction:column;align-items:center}.track{width:min(86vw,360px);height:6px;border-radius:4px;background:#ffffff1f;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,var(--blue),var(--red) 60%,var(--gold));transform:scaleX(0);transform-origin:left}.caption{margin-top:16px;color:#dfe5f5;font-size:11px;font-weight:800;letter-spacing:3px}.caption b{color:var(--red)}.hint{margin-top:13px;color:#9aa6c4;font-size:12px}.flash{position:absolute;inset:0;z-index:20;opacity:0;pointer-events:none;background:linear-gradient(135deg,#fff,#ffb9c2 48%,var(--red))}.flash.active{animation:burst .35s ease-out}@keyframes burst{35%{opacity:.55}100%{opacity:0}}@media(max-height:650px),(orientation:landscape){.logo-box{width:min(70vw,250px,37vh)}.shape{width:min(55vw,210px,29vh)}.title{font-size:clamp(30px,9vh,52px)}.caption{margin-top:9px}.hint{margin-top:7px}}@media(prefers-reduced-motion:reduce){.glows,.streak,.sparkle,.sheen{display:none}.float{animation:none}.entrance,.sh,.prediction{animation:fade .5s forwards}.flash.active{animation:none}@keyframes fade{to{opacity:1}}}</style><div id="splash" role="button" tabindex="0" aria-label="Enter SH Prediction"><div class="glows"></div><div class="streak"></div><div class="streak"></div><div class="streak"></div><div class="streak"></div><div class="vignette"></div><div class="top"><button id="skip">Skip →</button></div><div class="center"><div class="logo-box" id="sparkles"><div class="entrance"><div class="float"><div class="shape"><img id="logo" src="sh-prediction-icon.png" alt="SH PREDICTION"><div class="sheen"></div></div></div></div></div><div class="title"><span class="sh">SH</span><span class="prediction">PREDICTION</span></div></div><div class="bottom"><div class="track" id="progress" role="progressbar" aria-label="Loading" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="fill" id="fill"></div></div><div class="caption">ENTERING ARENA <b>•</b> <span id="pct">0%</span></div><div class="hint">Tap anywhere to enter</div></div><div class="flash" id="flash"></div></div><script>(()=>{const splash=document.getElementById("splash"),logo=document.getElementById("logo"),fill=document.getElementById("fill"),pct=document.getElementById("pct"),progress=document.getElementById("progress"),flash=document.getElementById("flash"),reduced=matchMedia("(prefers-reduced-motion: reduce)").matches;const fallback="data:image/svg+xml,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300"><path fill="#e3122d" stroke="#ddd" stroke-width="5" d="M35 155 Q90 35 265 30 Q170 75 130 155Z"/><path fill="#1357cb" stroke="#ddd" stroke-width="5" d="M35 270 Q175 240 215 155 L270 155 Q220 260 35 270Z"/><rect x="125" y="125" width="130" height="50" rx="5" fill="#cdd3df"/><text x="190" y="146" text-anchor="middle" font-size="20" font-weight="bold">SH</text><text x="190" y="162" text-anchor="middle" font-size="12" fill="#a10b26">PREDICTION</text></svg>');function mask(src){document.documentElement.style.setProperty("--mask",'url("'+src+'")')}mask("sh-prediction-icon.png");logo.onerror=()=>{logo.onerror=null;logo.src=fallback;mask(fallback)};if(!reduced)for(let i=0;i<12;i++){const d=document.createElement("i"),a=i*Math.PI/6,r=34+Math.random()*12;d.className="sparkle";d.style.left=50+Math.cos(a)*r+"%";d.style.top=50+Math.sin(a)*r+"%";d.style.setProperty("--size",4+Math.random()*2+"px");d.style.setProperty("--color",["var(--red)","var(--blue)","var(--gold)"][i%3]);d.style.setProperty("--delay",i*.13+"s");document.getElementById("sparkles").appendChild(d)}let entering=false,timer,doneTimer;function update(n){fill.style.transform="scaleX("+n/100+")";pct.textContent=n+"%";progress.setAttribute("aria-valuenow",n)}// CONNECT YOUR APP HERE
function enterApp(){if(entering)return;entering=true;clearInterval(timer);clearTimeout(doneTimer);update(100);try{sessionStorage.setItem("shp_seen","1")}catch(e){}splash.classList.add("leaving");setTimeout(()=>{dispatchEvent(new CustomEvent("sh-prediction-enter"));if(window.parent!==window){window.parent.postMessage({type:"sh-prediction-enter"},location.origin);return}if(typeof window.SH_PREDICTION_HOME==="string"&&window.SH_PREDICTION_HOME.trim())location.href=window.SH_PREDICTION_HOME;else splash.remove()},400)}function finish(){update(100);if(reduced)enterApp();else{flash.classList.add("active");doneTimer=setTimeout(enterApp,350)}}splash.addEventListener("pointerdown",enterApp);splash.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();enterApp()}});document.getElementById("skip").onclick=e=>{e.stopPropagation();enterApp()};const forced=new URLSearchParams(location.search).get("splash")==="1";try{if(!forced&&sessionStorage.getItem("shp_seen")==="1"){enterApp();return}}catch(e){}const start=Date.now();timer=setInterval(()=>{if(entering)return;const ratio=Math.min((Date.now()-start)/4300,1);if(ratio>=1){clearInterval(timer);finish()}else update(Math.min(99,Math.floor(ratio*99)))},60)})();</script></html>
