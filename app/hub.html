<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SH PREDICTION</title>
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<meta name="theme-color" content="#060d1d">
<style>
/* SH PREDICTION design system v1 — original tokens. Brand: navy base, blade red + blade blue accents. */
:root,[data-theme=dark]{--bg:#060d1d;--surface:#0d1830;--surface2:#13213d;--line:#22345a;--text:#eef3ff;--muted:#9fb0cc;
 --brand-red:#d01934;--brand-blue:#2366d6;--home:#3b8bff;--away:#ff8a1f;--win:#22c55e;--lose:#ef4444;--unknown:#8a94a6;--focus:#7cb4ff;color-scheme:dark}
[data-theme=light]{--bg:#f3f6fb;--surface:#ffffff;--surface2:#eef2f9;--line:#d5deec;--text:#0d1a33;--muted:#53627c;
 --home:#1d63d8;--away:#d96a00;--win:#14833b;--lose:#c62828;--unknown:#6b7280;--focus:#1d63d8;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Sans Telugu","Noto Sans Devanagari",sans-serif}
a{color:var(--focus)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
header.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--surface);border-bottom:1px solid var(--line)}
header.top img{width:34px;height:34px;object-fit:contain}
header.top h1{font-size:16px;letter-spacing:.12em;margin:0;flex:1;font-weight:800}
.bar{height:3px;background:linear-gradient(90deg,var(--brand-red),var(--brand-blue))}
main{max-width:1000px;margin:auto;padding:12px 12px 90px}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:6;display:grid;grid-template-columns:repeat(7,1fr);background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px;color:var(--muted);text-decoration:none;font-size:10.5px;text-align:center}
nav.tabs a svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8}
nav.tabs a[aria-current=page]{color:var(--text)}
nav.tabs a[aria-current=page] svg{stroke:var(--brand-blue)}
@media(min-width:900px){nav.tabs{position:sticky;top:57px;bottom:auto;max-width:1000px;margin:0 auto;border:1px solid var(--line);border-radius:0 0 14px 14px}main{padding-bottom:30px}}
h2{font-size:19px;margin:6px 0 10px}h3{font-size:15px;margin:0 0 6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.muted{color:var(--muted);font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0}
.chips::-webkit-scrollbar{display:none}
button,.btn{font:inherit;border:1px solid var(--line);background:var(--surface2);color:var(--text);border-radius:10px;padding:9px 13px;cursor:pointer;white-space:nowrap}
button.on,.btn.on{background:linear-gradient(100deg,var(--brand-red),var(--brand-blue));border-color:transparent;color:#fff}
button.primary{background:var(--brand-blue);border-color:transparent;color:#fff}
input,select{font:inherit;background:var(--surface2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px;min-width:0}
.grow{flex:1}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.stat{background:var(--surface2);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:22px}
.state{text-align:center;padding:28px 12px;color:var(--muted);border:1px dashed var(--line);border-radius:12px;margin:10px 0}
.offline{background:#7a4b00;color:#fff;padding:8px 12px;border-radius:10px;font-size:13px;margin:8px 0}
.skel{height:14px;border-radius:7px;background:linear-gradient(90deg,var(--surface2),var(--line),var(--surface2));background-size:200% 100%;animation:sk 1.2s infinite;margin:10px 0}
@keyframes sk{to{background-position:-200% 0}}
@media(prefers-reduced-motion:reduce){.skel{animation:none}}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;padding:2px 7px;border-radius:6px;background:var(--surface2);color:var(--muted)}
.tag.demo{background:#5b2a86;color:#fff}.tag.ver{background:#124d2c;color:#bff5d3}
/* Master List — approved 5-column format; colour is font colour only (no dots, bulbs or symbols) */
.ml{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.ml th,.ml td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.ml th{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);position:sticky;top:0;background:var(--surface)}
.ml td{font-weight:700;font-size:15px}
.c-home,.p-H{color:var(--home)}.c-away,.p-A{color:var(--away)}
.o-won{color:var(--win)}.o-lost{color:var(--lose)}.o-unknown,.c-none{color:var(--unknown)}
.tw{overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.prob{display:flex;height:30px;border-radius:9px;overflow:hidden;font-weight:800;font-size:13px}
.prob span{display:flex;align-items:center;padding:0 10px;color:#fff;white-space:nowrap;min-width:0}
.prob .h{background:var(--home)}.prob .a{background:var(--away);justify-content:flex-end}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:14px}.kv dt{color:var(--muted)}.kv dd{margin:0}
.list a.item{display:block;color:inherit;text-decoration:none}
.bars div{display:grid;grid-template-columns:120px 1fr 52px;gap:8px;align-items:center;font-size:13px;margin:5px 0}
.bars i{display:block;height:10px;border-radius:5px;background:linear-gradient(90deg,var(--brand-red),var(--brand-blue))}
.sub{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:8px 0}
.sub::-webkit-scrollbar{display:none}
table.simple{width:100%;border-collapse:collapse;font-size:13px}table.simple td,table.simple th{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left}
canvas{width:100%;height:180px;display:block}
</style>
</head>
<body>
<header class="top"><img src="/sh-prediction-icon.png" alt="SH PREDICTION logo"><h1>SH PREDICTION</h1><span id="who" class="muted"></span></header>
<div class="bar" aria-hidden="true"></div>
<nav class="tabs" id="tabs" aria-label="Main navigation"></nav>
<main id="main" tabindex="-1" aria-live="polite"></main>
<script>
"use strict";
const TOKEN=(()=>{try{return localStorage.getItem("shp_session")||""}catch(e){return ""}})();
const ICONS={home:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/>',master:'<path d="M4 5h16M4 10h16M4 15h16M4 20h16M9 5v15"/>',
 matches:'<circle cx="12" cy="12" r="8"/><path d="M8 6c3 3 3 9 0 12M16 6c-3 3-3 9 0 12"/>',experts:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1-5 15-5 16 0"/>',
 ai:'<path d="M12 3v3M12 18v3M3 12h3M18 12h3"/><rect x="7" y="7" width="10" height="10" rx="2"/>',accuracy:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
 settings:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/>'};
const NAV=[["home","nav.home"],["master","nav.master"],["matches","nav.matches"],["experts","nav.experts"],["ai","nav.ai"],["accuracy","nav.accuracy"],["settings","nav.settings"]];
const DEMO=()=>{try{return localStorage.getItem("shp_demo")==="1"}catch(e){return false}};
const dq=(p)=>DEMO()?p+(p.includes("?")?"&":"?")+"include_demo=1":p;
let S={},LANG=localStorage.getItem("shp_lang")||"en",PREF=null,CACHE={};
const t=k=>S[k]||k;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $=s=>document.querySelector(s);
const when=u=>{const d=new Date(u);return isNaN(d)?"—":d.toLocaleString(LANG,{dateStyle:"medium",timeStyle:"short"})};
async function api(path,opt={}){
 const o=Object.assign({headers:{"Content-Type":"application/json","Authorization":"Bearer "+TOKEN}},opt);
 try{const r=await fetch("/api/v1"+path,o);const j=await r.json().catch(()=>({}));
  if(!r.ok){const e=new Error((j.error&&j.error.message)||("HTTP "+r.status));e.status=r.status;throw e}
  if(!opt.method){CACHE[path]=j;try{localStorage.setItem("shp_cache:"+path,JSON.stringify(j))}catch(e){}}
  return j}
 catch(e){if(!opt.method&&!navigator.onLine){const c=CACHE[path]||JSON.parse(localStorage.getItem("shp_cache:"+path)||"null");if(c){c.__offline=true;return c}}throw e}}
const loading=()=>'<div aria-busy="true" aria-label="'+esc(t("state.loading"))+'"><div class="skel"></div><div class="skel" style="width:70%"></div><div class="skel" style="width:85%"></div></div>';
const emptyS=m=>'<div class="state" role="status">'+esc(m||t("state.empty"))+'</div>';
function errorS(el,e,retry){el.innerHTML='<div class="state" role="alert">'+esc(t("state.error"))+(e&&e.message?'<br><span class="muted">'+esc(e.message)+'</span>':'')+'<p><button id="retry">'+esc(t("action.retry"))+'</button></p></div>';$("#retry").onclick=retry}
const offlineBanner=j=>j&&j.__offline?'<div class="offline" role="status">'+esc(t("state.offline"))+'</div>':"";
const origin=o=>o==="demo"?' <span class="tag demo">'+esc(t("label.demo"))+'</span>':(o==="verified"?' <span class="tag ver">'+esc(t("label.verified"))+'</span>':"");
const teamTxt=(x,cls)=>'<span class="'+cls+'">'+esc(x.short_code||x.code||x.name)+'</span>';
/* Master List cell: "H-UB". Prefix colour is fixed by side; the code carries won/lost/unknown. */
function mcell(v){if(!v)return '<span class="o-unknown" aria-label="unknown">—</span>';
 const code=v.code||v.name;return '<span class="p-'+v.side+'">'+v.side+'</span><span class="o-unknown">-</span><span class="o-'+(v.outcome||"unknown")+'" aria-label="'+esc((v.outcome||"unknown")+" "+code)+'">'+esc(code)+'</span>'}

function navRender(cur){$("#tabs").innerHTML=NAV.map(([id,k])=>'<a href="#/'+id+'" '+(cur===id?'aria-current="page"':'')+'><svg viewBox="0 0 24 24" aria-hidden="true">'+ICONS[id]+'</svg>'+esc(t(k))+'</a>').join("")}

async function loadLang(code){try{const b=await api("/i18n/"+encodeURIComponent(code));S=b.strings;LANG=code;document.documentElement.lang=code;document.documentElement.dir=b.rtl?"rtl":"ltr";localStorage.setItem("shp_lang",code)}catch(e){if(!Object.keys(S).length)S={}}}
function setTheme(th){document.documentElement.dataset.theme=th;localStorage.setItem("shp_theme",th)}

/* ---------------- screens ---------------- */
const SCREENS={
async home(el){
 el.innerHTML='<h2>'+esc(t("nav.home"))+'</h2><div class="row"><input id="q" class="grow" type="search" placeholder="'+esc(t("home.search"))+'" aria-label="'+esc(t("home.search"))+'"></div><div class="chips" role="tablist" id="st"></div><div id="list">'+loading()+'</div><div id="sum"></div>';
 const st=[["live","home.live"],["upcoming","home.upcoming"],["completed","home.completed"]];let cur=sessionStorage.getItem("shp_home_st")||"upcoming";
 const draw=()=>{$("#st").innerHTML=st.map(([k,l])=>'<button role="tab" aria-selected="'+(k===cur)+'" class="'+(k===cur?"on":"")+'" data-k="'+k+'">'+esc(t(l))+'</button>').join("");
  document.querySelectorAll("#st button").forEach(b=>b.onclick=()=>{cur=b.dataset.k;sessionStorage.setItem("shp_home_st",cur);draw();go()})};
 const go=async()=>{const L=$("#list");L.innerHTML=loading();const q=$("#q").value.trim();
  try{const j=await api(dq("/matches?status="+cur+"&limit=30"+(q?"&q="+encodeURIComponent(q):"")));L.innerHTML=offlineBanner(j)+(j.items.length?'<div class="list">'+j.items.map(matchCard).join("")+'</div>':emptyS())}
  catch(e){errorS(L,e,go)}};
 draw();go();let tm;$("#q").oninput=()=>{clearTimeout(tm);tm=setTimeout(go,300)};
 try{const a=await api(dq("/analytics/accuracy"));const o=a.overall;$("#sum").innerHTML='<div class="card"><h3>'+esc(t("acc.overall"))+'</h3><div class="stats">'+stat(o.accuracy==null?"—":o.accuracy+"%",t("acc.overall"))+stat(o.correct,t("acc.correct"))+stat(o.incorrect,t("acc.incorrect"))+stat(o.pending,t("acc.pending"))+'</div><p class="muted">'+esc(t("acc.formula"))+'</p></div>'}catch(e){}
 try{const c=await api("/competitions");const fav=new Set((PREF&&PREF.favorite_competition_ids)||[]);
  $("#sum").innerHTML+='<div class="card"><h3>'+esc(t("label.competition"))+'</h3><div class="chips">'+c.items.slice(0,40).map(x=>'<button class="'+(fav.has(x.id)?"on":"")+'" data-c="'+x.id+'" aria-pressed="'+fav.has(x.id)+'">'+esc(x.name)+'</button>').join("")+'</div><p class="muted">Tap to add or remove a favourite competition.</p></div>';
  document.querySelectorAll("[data-c]").forEach(b=>b.onclick=async()=>{const id=+b.dataset.c;const s=new Set((PREF&&PREF.favorite_competition_ids)||[]);s.has(id)?s.delete(id):s.add(id);
   try{PREF=await api("/me/preferences",{method:"PUT",body:JSON.stringify({favorite_competition_ids:[...s]})});b.classList.toggle("on",s.has(id));b.setAttribute("aria-pressed",s.has(id))}catch(e){}})}catch(e){}
},
async master(el){
 el.innerHTML='<h2>'+esc(t("nav.master"))+'</h2><div class="row"><select id="comp" class="grow" aria-label="'+esc(t("label.competition"))+'"><option value="">'+esc(t("label.all"))+'</option></select><div class="chips" role="tablist" id="view"></div></div><div id="ml">'+loading()+'</div>';
 let view=sessionStorage.getItem("shp_ml_view")||"pred";
 try{const c=await api("/competitions");$("#comp").innerHTML+=c.items.map(x=>'<option value="'+x.id+'">'+esc(x.name)+'</option>').join("");$("#comp").value=sessionStorage.getItem("shp_ml_comp")||""}catch(e){}
 const drawV=()=>{$("#view").innerHTML=[["pred","view.predicted"],["act","view.actual"]].map(([k,l])=>'<button role="tab" aria-selected="'+(k===view)+'" class="'+(k===view?"on":"")+'" data-v="'+k+'">'+esc(t(l))+'</button>').join("");
  document.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>{view=b.dataset.v;sessionStorage.setItem("shp_ml_view",view);drawV();go()})};
 const go=async()=>{const M=$("#ml");M.innerHTML=loading();const cid=$("#comp").value;sessionStorage.setItem("shp_ml_comp",cid);
  try{const j=await api(dq("/master-list"+(cid?"?competition_id="+cid:"")));
   if(!j.items.length){M.innerHTML=offlineBanner(j)+emptyS();return}
   M.innerHTML=offlineBanner(j)+'<div class="tw"><table class="ml"><thead><tr>'+["col.match","col.home","col.away","col.toss","col.winner"].map(k=>'<th scope="col">'+esc(t(k))+'</th>').join("")+'</tr></thead><tbody>'+
    j.items.map(r=>'<tr><td><a href="#/match/'+r.match_id+'" style="color:inherit">'+esc(r.match)+'</a></td><td>'+teamTxt(r.home,"c-home")+'</td><td>'+teamTxt(r.away,"c-away")+'</td><td>'+
     mcell(view==="pred"?r.toss_prediction:r.toss_actual)+'</td><td>'+mcell(view==="pred"?r.winner_prediction:r.winner_actual)+'</td></tr>').join("")+'</tbody></table></div>'+
    '<p class="muted">'+(view==="pred"?"Locked pre-match picks. Team code turns green when the pick was right, red when wrong, grey while the result is unknown.":"Verified toss and match winners. Grey — means no verified result.")+' H = home team, A = away team. Codes show only when the short code is approved.</p>'}
  catch(e){errorS(M,e,go)}};
 drawV();$("#comp").onchange=go;go();
},
async matches(el){
 el.innerHTML='<h2>'+esc(t("nav.matches"))+'</h2><div id="list">'+loading()+'</div>';
 const go=async()=>{try{const [l,u,c]=await Promise.all(["live","upcoming","completed"].map(s=>api(dq("/matches?status="+s+"&limit=20"))));
  $("#list").innerHTML=offlineBanner(l)+[["home.live",l],["home.upcoming",u],["home.completed",c]].map(([k,j])=>'<h3 style="margin-top:14px">'+esc(t(k))+'</h3>'+(j.items.length?j.items.map(matchCard).join(""):emptyS())).join("")}
  catch(e){errorS($("#list"),e,go)}};go();
},
async match(el,id,tab){
 tab=tab||"info";el.innerHTML=loading();
 let m;try{m=await api("/matches/"+id)}catch(e){return errorS(el,e,()=>SCREENS.match(el,id,tab))}
 const tabs=[["info","Info"],["xi","Playing XI"],["preds","Predictions"],["ai","AI"],["live","Live"],["score","Scorecard"],["comm","Commentary"]];
 el.innerHTML='<p><a href="#/matches">← '+esc(t("nav.matches"))+'</a></p><div class="card"><h3>'+teamTxt(m.home,"c-home")+' <span class="muted">vs</span> '+teamTxt(m.away,"c-away")+origin(m.data_origin)+'</h3><div class="muted">'+esc(m.home.name)+' vs '+esc(m.away.name)+' · '+esc(m.competition)+' · '+esc(m.format)+' · '+when(m.start_utc)+'</div></div>'+
  '<div class="sub" role="tablist">'+tabs.map(([k,l])=>'<a class="btn '+(k===tab?"on":"")+'" role="tab" aria-selected="'+(k===tab)+'" href="#/match/'+id+'/'+k+'">'+esc(l)+'</a>').join("")+'</div><div id="tb">'+loading()+'</div>';
 const tb=$("#tb");const nm=tid=>tid===m.home.id?teamTxt(m.home,"c-home"):(tid===m.away.id?teamTxt(m.away,"c-away"):"—");
 try{
 if(tab==="info"){tb.innerHTML='<div class="card"><dl class="kv"><dt>Status</dt><dd>'+esc(m.status)+'</dd><dt>Venue</dt><dd>'+esc(m.venue||"—")+'</dd><dt>Match</dt><dd>'+esc(m.match_no||"—")+'</dd>'+
  '<dt>'+esc(t("col.toss"))+'</dt><dd>'+(m.toss_winner_id?nm(m.toss_winner_id)+" · "+esc(m.toss_decision||""):"—")+'</dd><dt>Result</dt><dd>'+(m.result_type?esc(m.result_type)+(m.winner_team_id?" · "+nm(m.winner_team_id):"")+(m.margin?" · "+esc(m.margin):"")+(m.method?" ("+esc(m.method)+")":""):"—")+'</dd>'+
  '<dt>Weather</dt><dd>'+esc(m.weather||"Not reported")+'</dd><dt>Pitch</dt><dd>'+esc(m.pitch_report||"Not reported")+'</dd><dt>Head to head</dt><dd>'+m.head_to_head.matches+' · '+teamTxt(m.home,"c-home")+' '+m.head_to_head.home_won+' – '+m.head_to_head.away_won+' '+teamTxt(m.away,"c-away")+'</dd>'+
  '<dt>Form (last 5)</dt><dd>'+teamTxt(m.home,"c-home")+' '+esc(m.form.home_last5||"—")+' · '+teamTxt(m.away,"c-away")+' '+esc(m.form.away_last5||"—")+'</dd><dt>Source</dt><dd class="muted">'+esc(m.source)+'</dd></dl></div>';return}
 if(tab==="xi"){const xi=m.playing_xi.length?m.playing_xi:m.squads;tb.innerHTML=xi.length?[m.home,m.away].map(T=>'<div class="card"><h3>'+teamTxt(T,T===m.home?"c-home":"c-away")+' '+esc(T.name)+'</h3>'+xi.filter(p=>p.team_id===T.id).map(p=>'<div>'+esc(p.name)+(p.is_captain?" (c)":"")+(p.is_keeper?" (wk)":"")+' <span class="muted">'+esc(p.role||"")+'</span></div>').join("")+'</div>').join(""):emptyS("Playing XI not announced or not verified yet");return}
 if(tab==="preds"){const j=await api("/matches/"+id+"/predictions");tb.innerHTML=j.items.length?j.items.map(p=>'<div class="card"><h3>'+esc(p.prediction_type)+' · '+(p.predicted_team_id?nm(p.predicted_team_id):esc(p.predicted_value))+origin(p.data_origin)+'</h3><div class="muted">'+esc(p.expert_name?p.expert_name+(p.expert_verified?" ✔︎ "+t("exp.verified"):""):(p.model||"SH v0 register"))+' · '+esc(t("ai.confidence"))+': '+(p.confidence==null?"—":p.confidence+"%")+'</div>'+(p.explanation?'<p>'+esc(p.explanation)+'</p>':'')+
   '<dl class="kv"><dt>Created</dt><dd>'+when(p.created_at)+'</dd><dt>Locked</dt><dd>'+when(p.locked_at)+'</dd><dt>Evaluation</dt><dd class="'+({correct:"o-won",incorrect:"o-lost"}[p.evaluation]||"o-unknown")+'">'+esc(p.evaluation||"pending")+(p.rule?' <span class="muted">('+esc(p.rule)+')</span>':'')+'</dd>'+(p.versions.length?'<dt>Live versions</dt><dd>'+p.versions.length+'</dd>':'')+'</dl></div>').join(""):emptyS("No locked predictions for this match");return}
 if(tab==="ai"){const s=await api("/matches/"+id+"/signals");const pm=s.pre_match;
  tb.innerHTML='<div class="card"><h3>'+esc(t("nav.ai"))+' <span class="tag">'+esc(pm.model)+'</span></h3>'+probBar(pm.home_win_probability,m)+'<p class="muted">'+esc(t("ai.confidence"))+': '+esc(pm.confidence_level)+' · '+pm.history_matches_used+' verified matches used</p><h3>'+esc(t("ai.factors"))+'</h3><table class="simple"><tbody>'+pm.factors.map(f=>'<tr><td>'+esc(f.factor.replace(/_/g," "))+'</td><td class="muted">'+esc(f.detail||(f.home+" vs "+f.away))+'</td><td>'+(f.contribution>0?"+":"")+f.contribution+'</td></tr>').join("")+'</tbody></table><p class="muted">Positive values favour the home team. '+esc(t("ai.toss_note"))+'</p></div>'+
   '<div class="card"><h3>First innings projection</h3>'+(s.projected_first_innings.available?'<b>'+s.projected_first_innings.projected+'</b> <span class="muted">(range '+s.projected_first_innings.low+'–'+s.projected_first_innings.high+', '+s.projected_first_innings.samples+' innings)</span>':'<span class="muted">'+esc(s.projected_first_innings.reason)+'</span>')+'</div>';return}
 if(tab==="live"){const s=await api("/matches/"+id+"/signals");const L=s.live;if(!L){tb.innerHTML=emptyS("No ball-by-ball data for this match yet");return}
  tb.innerHTML='<div class="card"><h3>Innings '+L.innings_no+' · '+esc(L.score)+' ('+esc(L.overs)+' ov)</h3>'+probBar(L.home_win_probability,m)+'<dl class="kv"><dt>CRR</dt><dd>'+L.current_run_rate+'</dd>'+(L.required_run_rate!=null?'<dt>RRR</dt><dd>'+L.required_run_rate+' · need '+L.runs_needed+'</dd>':'<dt>Projected</dt><dd>'+L.projected_score+'</dd>')+'<dt>Partnership</dt><dd>'+L.partnership.runs+' ('+L.partnership.balls+')</dd><dt>Last 12 balls</dt><dd>'+L.momentum_last_12_balls.runs+' runs, '+L.momentum_last_12_balls.wickets+' wkts</dd></dl></div>'+
   '<div class="card"><h3>Live prediction history</h3><canvas id="lh" width="700" height="200" aria-label="Home win probability over time"></canvas><h3 style="margin-top:10px">Turning points</h3>'+(s.turning_points.length?s.turning_points.map(x=>'<div>'+esc(x.at)+': <b class="'+(x.home_swing>=0?"c-home":"c-away")+'">'+(x.home_swing>0?"+":"")+x.home_swing+'%</b></div>').join(""):'<span class="muted">—</span>')+'</div>';
  drawLine($("#lh"),s.live_history.map(v=>v.predicted_team_id===m.home.id?v.confidence:100-v.confidence));return}
 if(tab==="score"){const j=await api("/matches/"+id+"/scorecard");tb.innerHTML=j.innings.length?j.innings.map(i=>'<div class="card"><h3>'+nm(i.batting_team_id)+' '+i.runs+'/'+i.wickets+' ('+i.overs+' ov)'+(i.target?' · target '+i.target:'')+'</h3>'+(i.players.length?'<table class="simple"><thead><tr><th>Player</th><th>R</th><th>B</th><th>4s</th><th>6s</th><th>O</th><th>W</th></tr></thead><tbody>'+i.players.map(p=>'<tr><td>'+esc(p.name)+' <span class="muted">'+esc(p.dismissal||"")+'</span></td><td>'+(p.runs??"")+'</td><td>'+(p.balls??"")+'</td><td>'+(p.fours??"")+'</td><td>'+(p.sixes??"")+'</td><td>'+esc(p.overs_bowled||"")+'</td><td>'+(p.wickets??"")+'</td></tr>').join("")+'</tbody></table>':'<p class="muted">Player figures not verified yet.</p>')+(i.fall_of_wickets.length?'<p class="muted">Wickets at balls: '+i.fall_of_wickets.map(w=>w.over_no+"."+w.ball_in_over).join(", ")+'</p>':'')+'</div>').join(""):emptyS("Scorecard not available yet");return}
 if(tab==="comm"){const j=await api("/matches/"+id+"/commentary?limit=60");tb.innerHTML=j.items.length?'<div class="card">'+j.items.map(b=>'<div style="padding:6px 0;border-bottom:1px solid var(--line)"><b>'+b.over_no+'.'+b.ball_in_over+'</b> '+(b.is_wicket?'<b class="o-lost">W</b> ':'')+'<b>'+(b.runs_bat+b.extras)+'</b>'+(b.extra_type?' <span class="muted">'+esc(b.extra_type)+'</span>':'')+' '+esc(b.commentary||"")+'</div>').join("")+'</div>':emptyS("No commentary yet");return}
 }catch(e){errorS(tb,e,()=>SCREENS.match(el,id,tab))}
},
async experts(el,id){
 if(id){el.innerHTML=loading();try{const j=await api("/experts/"+id+"/history");const x=j.expert,s=j.summary;
  el.innerHTML='<p><a href="#/experts">← '+esc(t("nav.experts"))+'</a></p><div class="card"><h3>'+esc(x.display_name)+(x.verified?' <span class="tag ver">'+esc(t("exp.verified"))+'</span>':'')+'</h3><p>'+esc(x.bio||"")+'</p><div class="stats">'+stat(s.accuracy==null?"—":s.accuracy+"%",t("acc.overall"))+stat(s.correct,t("acc.correct"))+stat(s.incorrect,t("acc.incorrect"))+stat(s.pending,t("acc.pending"))+'</div>'+(x.contact_url?'<p><a href="'+esc(x.contact_url)+'" rel="noopener" target="_blank">Contact</a></p>':'')+'</div><h3>'+esc(t("exp.history"))+'</h3>'+
   (j.items.length?j.items.map(p=>'<a class="card item" style="display:block;color:inherit;text-decoration:none" href="#/match/'+p.match_id+'/preds"><b>'+esc(p.prediction_type)+'</b> · '+esc(p.predicted_team||"")+' · '+(p.confidence??"—")+'% <span class="'+({correct:"o-won",incorrect:"o-lost"}[p.evaluation]||"o-unknown")+'">'+esc(p.evaluation||"pending")+'</span><div class="muted">'+when(p.created_at)+'</div></a>').join(""):emptyS())}catch(e){errorS(el,e,()=>SCREENS.experts(el,id))}return}
 el.innerHTML='<h2>'+esc(t("nav.experts"))+'</h2><div id="ex">'+loading()+'</div>';
 const go=async()=>{try{const j=await api("/experts?limit=50");$("#ex").innerHTML=j.items.length?j.items.map(x=>'<div class="card"><div class="row"><b class="grow">#'+x.rank+' '+esc(x.display_name)+(x.verified?' <span class="tag ver">'+esc(t("exp.verified"))+'</span>':'')+'</b><button data-f="'+x.id+'">'+esc(t("exp.follow"))+'</button></div><div class="muted">'+esc(x.country||"—")+' · '+esc(x.language_code||"")+' · '+x.followers+' followers</div><div>'+esc(t("acc.overall"))+': <b>'+(x.accuracy.accuracy==null?"—":x.accuracy.accuracy+"%")+'</b> <span class="muted">('+x.accuracy.correct+'/'+x.accuracy.settled+')</span></div><p><a href="#/experts/'+x.id+'">'+esc(t("exp.history"))+' →</a></p></div>').join(""):emptyS("No expert profiles yet");
  document.querySelectorAll("[data-f]").forEach(b=>b.onclick=async()=>{try{await api("/experts/"+b.dataset.f+"/follow",{method:"POST",body:'{"follow":true}'});b.textContent=t("exp.following");b.classList.add("on")}catch(e){b.textContent=e.message}})}
  catch(e){errorS($("#ex"),e,go)}};go();
},
async ai(el){
 el.innerHTML='<h2>'+esc(t("nav.ai"))+'</h2><p class="muted">'+esc(t("ai.toss_note"))+'</p><div id="ai">'+loading()+'</div>';
 const go=async()=>{try{const j=await api(dq("/matches?status=upcoming&limit=10"));if(!j.items.length){$("#ai").innerHTML=emptyS();return}
  const sig=await Promise.all(j.items.map(m=>api("/matches/"+m.id+"/signals").catch(()=>null)));
  $("#ai").innerHTML=j.items.map((m,i)=>'<a class="card" style="display:block;color:inherit;text-decoration:none" href="#/match/'+m.id+'/ai"><h3>'+teamTxt(m.home,"c-home")+' vs '+teamTxt(m.away,"c-away")+origin(m.data_origin)+'</h3><div class="muted">'+esc(m.competition)+' · '+when(m.start_utc)+'</div>'+(sig[i]?probBar(sig[i].pre_match.home_win_probability,m)+'<div class="muted">'+esc(t("ai.confidence"))+': '+esc(sig[i].pre_match.confidence_level)+'</div>':'')+'</a>').join("")}
  catch(e){errorS($("#ai"),e,go)}};go();
},
async accuracy(el){
 const demo=DEMO();
 el.innerHTML='<h2>'+esc(t("nav.accuracy"))+'</h2><label class="row muted"><input type="checkbox" id="dm" '+(demo?"checked":"")+'> Include demo data</label><div id="acc">'+loading()+'</div>';
 $("#dm").onchange=e=>{localStorage.setItem("shp_demo",e.target.checked?"1":"0");SCREENS.accuracy(el)};
 const go=async()=>{try{const q=demo?"?include_demo=1":"";const [a,tos,ha,v]=await Promise.all([api("/analytics/accuracy"+q),api("/analytics/toss"+q),api("/analytics/home-away"+q),api("/analytics/venue"+q)]);
  const o=a.overall,tbl=(title,obj)=>{const k=Object.keys(obj);return '<div class="card"><h3>'+esc(title)+'</h3>'+(k.length?'<div class="bars">'+k.map(n=>'<div><span>'+esc(n)+'</span><span><i style="width:'+(obj[n].accuracy||0)+'%"></i></span><b>'+(obj[n].accuracy==null?"—":obj[n].accuracy+"%")+'</b></div>').join("")+'</div>':'<span class="muted">—</span>')+'</div>'};
  $("#acc").innerHTML='<div class="card"><div class="stats">'+stat(o.total_predictions,t("acc.total"))+stat(o.correct,t("acc.correct"))+stat(o.incorrect,t("acc.incorrect"))+stat(o.pending,t("acc.pending"))+stat(o.void,t("acc.void"))+stat(o.accuracy==null?"—":o.accuracy+"%",t("acc.overall"))+'</div><p class="muted">'+esc(t("acc.formula"))+'. Pending, void and ineligible are not in the denominator.</p></div>'+
   tbl("Prediction type",a.by_type)+tbl(t("acc.by_league"),a.by_league)+tbl(t("acc.by_expert"),a.by_expert)+tbl(t("acc.by_team"),a.by_team)+
   '<div class="card"><h3>'+esc(t("an.toss"))+'</h3>'+pair(tos.toss.toss_winner_won,tos.toss.toss_winner_lost,"Toss winner won","Toss winner lost")+'<h3 style="margin-top:12px">'+esc(t("an.batfirst"))+'</h3>'+pair(tos.batting_first_vs_chasing.batting_first_won,tos.batting_first_vs_chasing.chasing_won,"Batting first","Chasing")+'</div>'+
   '<div class="card"><h3>'+esc(t("an.homeaway"))+'</h3>'+pair(ha.home_away.home_won,ha.home_away.away_won,"Home","Away")+'<h3 style="margin-top:12px">'+esc(t("an.day"))+'</h3><table class="simple"><tbody>'+Object.entries(ha.day_of_week_utc).map(([d,x])=>'<tr><td>'+esc(d)+'</td><td>'+x.matches+' matches</td><td>home '+(x.home_win_pct??"—")+'%</td></tr>').join("")+'</tbody></table></div>'+
   '<div class="card"><h3>'+esc(t("an.venue"))+'</h3><table class="simple"><tbody>'+Object.entries(v.venue).map(([n,x])=>'<tr><td>'+esc(n)+'</td><td>'+x.matches+'</td><td>bat first '+(x.batting_first_win_pct??"—")+'%</td></tr>').join("")+'</tbody></table><p class="muted">'+esc(v.note)+' Sample: '+v.sample_matches+' matches.</p></div>'}
  catch(e){errorS($("#acc"),e,go)}};go();
},
async settings(el){
 el.innerHTML='<h2>'+esc(t("nav.settings"))+'</h2><div class="card"><label>'+esc(t("label.language"))+'<br><select id="lang" style="width:100%;margin-top:6px"></select></label><p class="muted" id="langnote"></p><label>'+esc(t("label.theme"))+'<br><select id="theme" style="width:100%;margin-top:6px"><option value="dark">'+esc(t("theme.dark"))+'</option><option value="light">'+esc(t("theme.light"))+'</option></select></label><label class="row" style="margin-top:12px"><input type="checkbox" id="demo"> Show demo data (marked DEMO, never counted unless you choose)</label><p id="msg" role="status" class="muted"></p></div><div class="card"><a href="/">Classic screens, login and admin</a></div>';
 try{const L=await api("/languages");$("#lang").innerHTML=L.items.map(l=>'<option value="'+l.code+'">'+esc(l.native_name)+' — '+esc(l.name)+(l.ui_complete?"":" (English fallback)")+'</option>').join("");$("#lang").value=LANG}catch(e){$("#langnote").textContent=t("state.error")+": "+e.message;return}
 $("#theme").value=document.documentElement.dataset.theme;$("#demo").checked=DEMO();$("#demo").onchange=e=>{localStorage.setItem("shp_demo",e.target.checked?"1":"0");$("#msg").textContent=t("settings.saved")};
 if(!$("#langnote").textContent)$("#langnote").textContent="Team, player and venue names, numbers and cricket terms stay in their official form.";
 const save=async b=>{try{PREF=await api("/me/preferences",{method:"PUT",body:JSON.stringify(b)});$("#msg").textContent=t("settings.saved")}catch(e){$("#msg").textContent=e.message}};
 $("#lang").onchange=async e=>{await save({language_code:e.target.value});await loadLang(e.target.value);route()};
 $("#theme").onchange=async e=>{setTheme(e.target.value);await save({theme:e.target.value})};
}};
function stat(v,l){return '<div class="stat"><b>'+esc(v)+'</b><span class="muted">'+esc(l)+'</span></div>'}
function pair(a,b,la,lb){const n=a+b,p=n?Math.round(100*a/n):0;return n?'<div class="prob"><span class="h" style="width:'+Math.max(p,12)+'%">'+esc(la)+' '+a+'</span><span class="a" style="width:'+Math.max(100-p,12)+'%">'+esc(lb)+' '+b+'</span></div>':'<span class="muted">—</span>'}
function probBar(h,m){const a=Math.round((100-h)*10)/10;return '<div class="prob" role="img" aria-label="'+esc(m.home.name)+' '+h+'%, '+esc(m.away.name)+' '+a+'%"><span class="h" style="width:'+Math.max(h,14)+'%">'+esc(m.home.short_code||m.home.name)+' '+h+'%</span><span class="a" style="width:'+Math.max(a,14)+'%">'+a+'% '+esc(m.away.short_code||m.away.name)+'</span></div>'}
function matchCard(m){return '<a class="card" style="display:block;color:inherit;text-decoration:none" href="#/match/'+m.id+'"><div class="row"><b class="grow">'+teamTxt(m.home,"c-home")+' <span class="muted">vs</span> '+teamTxt(m.away,"c-away")+'</b>'+origin(m.data_origin)+'</div><div class="muted">'+esc(m.home.name)+' vs '+esc(m.away.name)+'</div><div class="muted">'+esc(m.competition)+' · '+esc(m.match_no||"")+' · '+when(m.start_utc)+(m.venue?' · '+esc(m.venue):'')+'</div></a>'}
function drawLine(cv,vals){const x=cv.getContext("2d"),W=cv.width,H=cv.height,cs=getComputedStyle(document.documentElement);x.clearRect(0,0,W,H);
 x.strokeStyle=cs.getPropertyValue("--line");x.beginPath();x.moveTo(0,H/2);x.lineTo(W,H/2);x.stroke();if(vals.length<2){x.fillStyle=cs.getPropertyValue("--muted");x.fillText("Needs at least two updates",10,20);return}
 x.strokeStyle=cs.getPropertyValue("--home");x.lineWidth=3;x.beginPath();vals.forEach((v,i)=>{const px=i*(W-10)/(vals.length-1)+5,py=H-v/100*H;i?x.lineTo(px,py):x.moveTo(px,py)});x.stroke()}

async function route(){
 const h=(location.hash||"#/home").slice(2).split("/");const el=$("#main");
 if(!TOKEN){navRender("");el.innerHTML='<div class="card"><h3>Login needed</h3><p class="muted">Sign in once on the main screen; this hub uses the same session.</p><p><a class="btn primary" href="/">Go to login</a></p></div>';return}
 const page=h[0]||"home";navRender(page==="match"?"matches":page);window.scrollTo(0,0);
 const fn=SCREENS[page]||SCREENS.home;try{await fn(el,h[1],h[2])}catch(e){errorS(el,e,route)}
}
window.addEventListener("hashchange",route);
window.addEventListener("online",route);window.addEventListener("offline",()=>{const el=$("#main");el.insertAdjacentHTML("afterbegin",'<div class="offline" role="status">'+esc(t("state.offline"))+'</div>')});
(async()=>{setTheme(localStorage.getItem("shp_theme")||"dark");await loadLang(LANG);
 if(TOKEN){try{PREF=await api("/me/preferences");if(PREF.language_code!==LANG)await loadLang(PREF.language_code);setTheme(PREF.theme)}catch(e){}}
 route()})();
</script>
