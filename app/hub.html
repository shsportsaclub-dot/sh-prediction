<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SH PREDICTION</title>
<link rel="icon" type="image/svg+xml" href="/icon.svg">

<style>
/* SH PREDICTION design system v1 — original tokens. Brand: navy base, blade red + blade blue accents. */
:root,[data-theme=dark]{--bg:#060d1d;--surface:#0d1830;--surface2:#13213d;--line:#22345a;--text:#eef3ff;--muted:#9fb0cc;
 --brand-red:#d01934;--brand-blue:#2366d6;--home:#3b8bff;--away:#ff8a1f;--win:#22c55e;--lose:#ef4444;--unknown:#8a94a6;--focus:#7cb4ff;color-scheme:dark}
[data-theme=light]{--bg:#f3f6fb;--surface:#ffffff;--surface2:#eef2f9;--line:#d5deec;--text:#0d1a33;--muted:#53627c;
 --home:#1d63d8;--away:#d96a00;--win:#14833b;--lose:#c62828;--unknown:#6b7280;--focus:#1d63d8;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Sans Telugu","Noto Sans Devanagari","Noto Sans Tamil","Noto Sans Kannada","Noto Sans Bengali","Noto Nastaliq Urdu",sans-serif}
a{color:var(--focus)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
header.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--surface);border-bottom:1px solid var(--line)}
header.top img{width:34px;height:34px;object-fit:contain}
header.top h1{font-size:16px;letter-spacing:.12em;margin:0;flex:1;font-weight:800}
.bar{height:3px;background:linear-gradient(90deg,var(--brand-red),var(--brand-blue))}
main{max-width:1000px;margin:auto;padding:12px 12px 90px}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:6;display:grid;grid-template-columns:repeat(6,1fr);background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px;color:var(--muted);text-decoration:none;font-size:10.5px;text-align:center}
nav.tabs a svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8}
nav.tabs a[aria-current=page]{color:var(--text)}
nav.tabs a[aria-current=page] svg{stroke:var(--brand-blue)}
@media(min-width:900px){nav.tabs{position:sticky;top:57px;bottom:auto;max-width:1000px;margin:0 auto;border:1px solid var(--line);border-radius:0 0 14px 14px}main{padding-bottom:30px}}
h2{font-size:19px;margin:6px 0 10px}h3{font-size:15px;margin:0 0 6px}
.card{display:block;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0;color:inherit;text-decoration:none}
.muted{color:var(--muted);font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chips,.sub{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0}
.chips::-webkit-scrollbar,.sub::-webkit-scrollbar{display:none}
.sub{margin:8px 0}
button,.btn{font:inherit;border:1px solid var(--line);background:var(--surface2);color:var(--text);border-radius:10px;padding:9px 13px;cursor:pointer;white-space:nowrap;text-decoration:none;display:inline-block}
button.on,.btn.on{background:linear-gradient(100deg,var(--brand-red),var(--brand-blue));border-color:transparent;color:#fff}
button.primary{background:var(--brand-blue);border-color:transparent;color:#fff}
input,select,textarea{font:inherit;background:var(--surface2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px;min-width:0}
.grow{flex:1}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.stat{background:var(--surface2);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:22px}
.state{text-align:center;padding:28px 12px;color:var(--muted);border:1px dashed var(--line);border-radius:12px;margin:10px 0}
.offline{background:#7a4b00;color:#fff;padding:8px 12px;border-radius:10px;font-size:13px;margin:8px 0}
.skel{height:14px;border-radius:7px;background:linear-gradient(90deg,var(--surface2),var(--line),var(--surface2));background-size:200% 100%;animation:sk 1.2s infinite;margin:10px 0}
@keyframes sk{to{background-position:-200% 0}}
@media(prefers-reduced-motion:reduce){.skel{animation:none}}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;padding:2px 7px;border-radius:6px;background:var(--surface2);color:var(--muted)}
.tag.demo{background:#5b2a86;color:#fff}.tag.ver{background:#124d2c;color:#bff5d3}
.c-home{color:var(--home)}.c-away{color:var(--away)}.o-won{color:var(--win)}.o-lost{color:var(--lose)}.o-unknown{color:var(--unknown)}
.prob{display:flex;height:30px;border-radius:9px;overflow:hidden;font-weight:800;font-size:13px}
.prob span{display:flex;align-items:center;padding:0 10px;color:#fff;white-space:nowrap;min-width:0}
.prob .h{background:var(--home)}.prob .a{background:var(--away);justify-content:flex-end}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:14px}.kv dt{color:var(--muted)}.kv dd{margin:0}
.bars div{display:grid;grid-template-columns:120px 1fr 52px;gap:8px;align-items:center;font-size:13px;margin:5px 0}
.bars i{display:block;height:10px;border-radius:5px;background:linear-gradient(90deg,var(--brand-red),var(--brand-blue))}
table.simple{width:100%;border-collapse:collapse;font-size:13px}table.simple td,table.simple th{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left}
canvas{width:100%;height:190px;display:block}
.msg{padding:10px 12px;border-radius:12px;margin:8px 0;max-width:92%;white-space:pre-wrap}
.msg.q{background:var(--brand-blue);color:#fff;margin-left:auto}.msg.a{background:var(--surface2)}
.mc-head{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;background:#0d1424;color:#fff;border-radius:14px 14px 0 0;padding:12px 14px;margin-top:8px}
.mc-lines{flex:1}.mc-line{font-size:15px;opacity:.75}.mc-line.cur{font-size:22px;opacity:1}.mc-score{color:#4fb3ff;font-weight:800}
.mc-ev{font-weight:900;font-size:22px;letter-spacing:1px;padding:4px 10px;border-radius:10px;animation:mcpop .5s ease-out}.ev-four{color:#2fd27a}.ev-six{color:#ff4fd8}.ev-wicket{color:#ff4d4d}
@keyframes mcpop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
.mc-strip{display:flex;gap:14px;flex-wrap:wrap;align-items:center;background:#151f36;color:#cfe;padding:6px 14px;border-radius:0 0 14px 14px;font-size:13px}.mc-fresh{font-size:12px;margin:4px 2px 8px}
.ov-strip{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.bl{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;background:var(--surface2);font-weight:700;font-size:13px}
.bl.b4{background:#13a058;color:#fff}.bl.b6{background:#c22fc0;color:#fff}.bl.bw{background:#d83131;color:#fff}.bl.b1{background:#2c3d5f;color:#fff}
.sc td .dis{font-size:12px}.sq-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}.sq-p{display:flex;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.av{width:34px;height:34px;border-radius:50%;background:var(--surface2);display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:13px}
.fm{display:inline-flex;width:24px;height:24px;border-radius:50%;align-items:center;justify-content:center;font-size:12px;font-weight:800;margin-left:4px;background:var(--surface2)}.fm.fW{background:#13a058;color:#fff}.fm.fL{background:#5b1420;color:#fff}
.h2h-row{display:grid;grid-template-columns:1fr auto;gap:2px 8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
header.top{display:flex;align-items:center;gap:10px}.hdr{display:flex;gap:2px;align-items:center}.hb{background:none;border:0;padding:6px;color:var(--text);display:inline-flex;align-items:center;cursor:pointer}
.hb svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8}.live-dot{background:#e0262f;color:#fff;font-size:11px;font-weight:800;padding:2px 7px;border-radius:999px;letter-spacing:.5px;animation:lp 1.6s infinite}
@keyframes lp{50%{opacity:.6}}.sports{display:flex;gap:8px;overflow-x:auto;margin:6px 0 10px}.sp{flex:1 0 64px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;border-radius:14px;background:var(--surface);border:1px solid var(--line);color:var(--text);font-size:12px}
.sp span{font-size:22px}.sp small{font-size:9px;color:var(--muted)}.sp.on{background:linear-gradient(135deg,#b3122e,#e0262f);color:#fff;border-color:transparent}.sp[aria-disabled=true]{opacity:.55}.shake{animation:sk .4s}@keyframes sk{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.qlinks{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:6px}.qlinks a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;border-radius:12px;background:var(--surface);border:1px solid var(--line);color:var(--text);text-decoration:none;font-size:11px;text-align:center}.qlinks span{font-size:18px}
.upd{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);z-index:99;background:#0f9d58;color:#fff;padding:10px 14px;border-radius:12px;font-size:13px;display:flex;gap:10px;align-items:center;box-shadow:0 6px 20px #0006}.upd button{background:#fff;color:#0f9d58;border:0;border-radius:8px;padding:5px 10px;font-weight:600}
/* view layouts: each one looks different */
body[data-mcview=pulse] .mc-head{background:linear-gradient(135deg,#7a0d22,#1d3fa8);padding:18px 16px}body[data-mcview=pulse] .mc-line.cur{font-size:30px}body[data-mcview=pulse] .mc-score{color:#fff}

body[data-mcview=classic] .mc-head{position:static;background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:12px 12px 0 0;padding:10px 12px}body[data-mcview=classic] .mc-line.cur{font-size:18px}body[data-mcview=classic] .mc-score{color:var(--text)}

.toss-l{color:#ffb020;font-weight:600;padding:8px 2px}.mcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin:8px 0}

.wx{display:flex;gap:14px;align-items:center}.wx .t{font-size:30px;font-weight:700}.donut{display:flex;align-items:center;gap:16px}.donut .lg{flex:1}.donut .lg div{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)}

tr.hl td{background:#1d4ed822}

<body>
<header class="top"><img src="/sh-prediction-icon.png" alt="SH PREDICTION logo"><h1>SH PREDICTION</h1><span class="grow"></span><div class="hdr" id="hdr"></div></header>
<div class="bar" aria-hidden="true"></div>
<nav class="tabs" id="tabs" aria-label="Main navigation"></nav>
<main id="main" tabindex="-1" aria-live="polite"></main>
<script>
"use strict";
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},del:k=>{try{localStorage.removeItem(k)}catch(e){}}};
let TOKEN=ls.get("shp_session")||"";
const ICONS={home:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/>',
 matches:'<circle cx="12" cy="12" r="8"/><path d="M8 6c3 3 3 9 0 12M16 6c-3 3-3 9 0 12"/>',experts:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1-5 15-5 16 0"/>',
 ai:'<path d="M12 3v3M12 18v3M3 12h3M18 12h3"/><rect x="7" y="7" width="10" height="10" rx="2"/>',assistant:'<path d="M4 5h16v11H9l-5 4z"/><path d="M8 10h8M8 13h5"/>',
 accuracy:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',settings:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/>'};
ICONS.social='<path d="M4 5h16v11H9l-5 4z"/><circle cx="9" cy="10.5" r="1"/><circle cx="15" cy="10.5" r="1"/>';ICONS.reels='<rect x="6" y="3" width="12" height="18" rx="2"/><path d="M11 9l4 3-4 3z"/>';ICONS.more='<circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/>';
ICONS.series='<path d="M4 4h16v4H4zM4 10h16v4H4zM4 16h10v4H4z"/>';ICONS.predictions='<path d="M4 19V9M10 19V5M16 19v-7M22 19H2"/>';
const NAV=[["home","nav.home"],["matches","nav.matches"],["series","nav.series"],["predictions","nav.predictions"],["more","nav.more"]];
const NAV_OF={match:"matches",post:"more",u:"more",tag:"more",compose:"more",social:"more",reels:"more",experts:"predictions",ai:"predictions",assistant:"more",accuracy:"more",settings:"more",leaderboard:"more",game:"more",notifications:"more",dashboard:"more",account:"more"};
const DEMO=()=>ls.get("shp_demo")==="1";
const dq=p=>DEMO()?p+(p.includes("?")?"&":"?")+"dataset=demo":p;
let S={},LANG=ls.get("shp_lang")||"en",PREF=null,CACHE={},CHAT=[];
const t=k=>S[k]||k;
window.mcLater=window.mcLater||(fn=>(window._mcq=window._mcq||[]).push(fn));
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $=s=>document.querySelector(s);
const when=u=>{const d=new Date(u);return isNaN(d)?"—":d.toLocaleString(LANG,{dateStyle:"medium",timeStyle:"short"})};
async function api(path,opt={}){
 const hd={"Content-Type":"application/json"};if(TOKEN)hd.Authorization="Bearer "+TOKEN;
 const o=Object.assign({headers:hd},opt);
 try{const r=await fetch("/api/v1"+path,o);const j=await r.json().catch(()=>({}));
  if(!r.ok){const e=new Error((j.error&&j.error.message)||("HTTP "+r.status));e.status=r.status;throw e}
  if(!opt.method){CACHE[path]=j;ls.set("shp_cache:"+path,JSON.stringify(j))}
  return j}
 catch(e){if(!opt.method&&!navigator.onLine){const c=CACHE[path]||JSON.parse(ls.get("shp_cache:"+path)||"null");if(c){c.__offline=true;return c}}throw e}}
const loading=()=>'<div aria-busy="true" aria-label="'+esc(t("state.loading"))+'"><div class="skel"></div><div class="skel" style="width:70%"></div><div class="skel" style="width:85%"></div></div>';
const emptyS=m=>'<div class="state" role="status">'+esc(m||t("state.empty"))+'</div>';
function errorS(el,e,retry){el.innerHTML='<div class="state" role="alert">'+esc(t("state.error"))+(e&&e.message?'<br><span class="muted">'+esc(e.message)+'</span>':'')+'<p><button class="retry">'+esc(t("action.retry"))+'</button></p></div>';el.querySelector(".retry").onclick=retry}
const offlineBanner=j=>j&&j.__offline?'<div class="offline" role="status">'+esc(t("state.offline"))+'</div>':"";
const origin=o=>o==="demo"?' <span class="tag demo">'+esc(t("label.demo"))+'</span>':"";
const teamTxt=(x,cls)=>'<span class="'+cls+'">'+esc(x.short_code||x.name)+'</span>';
function navRender(cur){const a=([id,k])=>'<a href="#/'+id+'" '+(cur===id?'aria-current="page"':'')+'><svg viewBox="0 0 24 24" aria-hidden="true">'+ICONS[id]+'</svg>'+esc(t(k))+'</a>';
 $("#tabs").innerHTML=NAV.slice(0,2).map(a).join("")+'<a href="#/compose" class="nav-plus" aria-label="'+esc(t("so.compose"))+'"><span>+</span>'+esc(t("ins.post"))+'</a>'+NAV.slice(2).map(a).join("")}
async function loadLang(code){try{const b=await api("/i18n/"+encodeURIComponent(code));S=b.strings;LANG=code;document.documentElement.lang=code;document.documentElement.dir=b.rtl?"rtl":"ltr";ls.set("shp_lang",code)}catch(e){}}
function setTheme(th){document.documentElement.dataset.theme=th;ls.set("shp_theme",th)}
function stat(v,l){return '<div class="stat"><b>'+esc(v)+'</b><span class="muted">'+esc(l)+'</span></div>'}
function pair(a,b,la,lb){const n=a+b,p=n?Math.round(100*a/n):0;return n?'<div class="prob"><span class="h" style="width:'+Math.max(p,12)+'%">'+esc(la)+' '+a+'</span><span class="a" style="width:'+Math.max(100-p,12)+'%">'+esc(lb)+' '+b+'</span></div>':'<span class="muted">—</span>'}
function probBar(h,m){const a=Math.round((100-h)*10)/10;return '<div class="prob" role="img" aria-label="'+esc(m.home.name)+' '+h+'%, '+esc(m.away.name)+' '+a+'%"><span class="h" style="width:'+Math.max(h,14)+'%">'+esc(m.home.short_code||m.home.name)+' '+h+'%</span><span class="a" style="width:'+Math.max(a,14)+'%">'+a+'% '+esc(m.away.short_code||m.away.name)+'</span></div>'}
function matchCard(m){return '<a class="card" href="#/match/'+m.id+'"><div class="row"><b class="grow">'+teamTxt(m.home,"c-home")+' <span class="muted">vs</span> '+teamTxt(m.away,"c-away")+'</b>'+origin(m.data_origin)+'</div><div class="muted">'+esc(m.home.name)+' vs '+esc(m.away.name)+'</div><div class="muted">'+esc(m.competition)+(m.match_no?' · '+esc(m.match_no):'')+' · '+when(m.start_utc)+(m.venue?' · '+esc(m.venue):'')+'</div>'+liveLine(m)+(m.data_status_label?'<div class="row" style="gap:6px;margin-top:4px"><span class="tag ds-'+esc(m.data_status)+'">'+esc(m.data_status_label)+'</span>'+(m.home_away_note?'<span class="muted" style="font-size:12px">'+esc(m.home_away_note)+'</span>':'')+'</div>':'')+'</a>'}
function liveLine(m){const L=m.live_score;if(!L||!L.innings||!L.innings.length)return "";return '<div style="margin-top:4px">'+L.innings.map(i=>'<b>'+esc(String(i.inning||"").replace(/ Inning \d+$/,""))+'</b> '+i.r+'/'+i.w+' ('+i.o+')').join(" · ")+(L.status_text?'<div class="muted">'+esc(L.status_text)+'</div>':'')+'</div>'}
function factorsHtml(fs){return fs&&fs.length?'<h3 style="margin-top:12px">'+esc(t("ai.factors"))+'</h3>'+fs.map(f=>'<div style="padding:6px 0;border-bottom:1px solid var(--line)"><b>'+esc(f.factor)+'</b>'+(f.favours_team?' — '+esc(t("ai.favours"))+' <b class="'+(f.favours==="home"?"c-home":"c-away")+'">'+esc(f.favours_team)+'</b>':'')+'<div class="muted">'+esc(f.detail)+'</div></div>').join(""):""}
function drawLine(cv,series,colors){if(!cv)return;const x=cv.getContext("2d"),W=cv.width,H=cv.height,cs=getComputedStyle(document.documentElement);x.clearRect(0,0,W,H);
 const max=Math.max(1,...series.flat());x.strokeStyle=cs.getPropertyValue("--line");x.beginPath();x.moveTo(0,H-1);x.lineTo(W,H-1);x.stroke();
 if(!series.some(s=>s.length>1)){x.fillStyle=cs.getPropertyValue("--muted");x.font="14px sans-serif";x.fillText("Needs at least two data points",10,24);return}
 const n=Math.max(...series.map(s=>s.length));series.forEach((s,k)=>{x.strokeStyle=cs.getPropertyValue(colors[k]);x.lineWidth=3;x.beginPath();s.forEach((v,i)=>{const px=i*(W-10)/Math.max(n-1,1)+5,py=H-6-v/max*(H-16);i?x.lineTo(px,py):x.moveTo(px,py)});x.stroke()})}
function drawBars(cv,vals,wk){if(!cv)return;const x=cv.getContext("2d"),W=cv.width,H=cv.height,cs=getComputedStyle(document.documentElement);x.clearRect(0,0,W,H);const max=Math.max(1,...vals),bw=W/Math.max(vals.length,1);
 vals.forEach((v,i)=>{x.fillStyle=cs.getPropertyValue(wk[i]?"--lose":"--home");const h=v/max*(H-20);x.fillRect(i*bw+2,H-h,bw-4,h)})}

const SCREENS={
async home(el){
 el.innerHTML='<h2>'+esc(t("nav.home"))+'</h2><input id="q" type="search" style="width:100%" placeholder="'+esc(t("home.search"))+'" aria-label="'+esc(t("home.search"))+'"><div class="chips" role="tablist" id="st" style="margin-top:8px"></div><div id="list">'+loading()+'</div><div id="sum"></div>';
 const st=[["live","home.live"],["upcoming","home.upcoming"],["completed","home.completed"]];let cur=sessionStorage.getItem("shp_home_st")||"upcoming";
 const draw=()=>{$("#st").innerHTML=st.map(([k,l])=>'<button role="tab" aria-selected="'+(k===cur)+'" class="'+(k===cur?"on":"")+'" data-k="'+k+'">'+esc(t(l))+'</button>').join("");
  document.querySelectorAll("#st button").forEach(b=>b.onclick=()=>{cur=b.dataset.k;sessionStorage.setItem("shp_home_st",cur);draw();go()})};
 const go=async()=>{const L=$("#list");L.innerHTML=loading();const q=$("#q").value.trim();
  try{const j=await api(dq("/matches?status="+cur+"&limit=30"+(q?"&q="+encodeURIComponent(q):"")));L.innerHTML=offlineBanner(j)+(j.items.length?j.items.map(matchCard).join(""):emptyS())}catch(e){errorS(L,e,go)}};
 draw();go();let tm;$("#q").oninput=()=>{clearTimeout(tm);tm=setTimeout(go,300)};
 try{const a=await api(dq("/analytics/accuracy"));const o=a.overall;$("#sum").innerHTML='<div class="card"><h3>'+esc(t("acc.overall"))+'</h3><div class="stats">'+stat(o.accuracy==null?"—":o.accuracy+"%",t("acc.overall"))+stat(o.correct,t("acc.correct"))+stat(o.incorrect,t("acc.incorrect"))+stat(o.pending,t("acc.pending"))+'</div><p class="muted">'+esc(t("acc.formula"))+'</p></div>'}catch(e){}
 try{const c=await api("/competitions");const fav=new Set((PREF&&PREF.favorite_competition_ids)||[]);
  $("#sum").innerHTML+='<div class="card"><h3>'+esc(t("label.competition"))+'</h3><div class="chips">'+c.items.slice(0,40).map(x=>'<button class="'+(fav.has(x.id)?"on":"")+'" data-c="'+x.id+'" aria-pressed="'+fav.has(x.id)+'">'+esc(x.name)+'</button>').join("")+'</div></div>';
  document.querySelectorAll("[data-c]").forEach(b=>b.onclick=async()=>{if(!TOKEN){location.hash="#/settings";return}const id=+b.dataset.c;const s=new Set((PREF&&PREF.favorite_competition_ids)||[]);s.has(id)?s.delete(id):s.add(id);
   try{PREF=await api("/me/preferences",{method:"PUT",body:JSON.stringify({favorite_competition_ids:[...s]})});b.classList.toggle("on",s.has(id));b.setAttribute("aria-pressed",s.has(id))}catch(e){}})}catch(e){}
},
async matches(el){
 el.innerHTML='<h2>'+esc(t("nav.matches"))+'</h2><div id="list">'+loading()+'</div>';
 const go=async()=>{try{const [l,u,c]=await Promise.all(["live","upcoming","completed"].map(s=>api(dq("/matches?status="+s+"&limit=20"))));
  $("#list").innerHTML=offlineBanner(l)+[["home.live",l],["home.upcoming",u],["home.completed",c]].map(([k,j])=>'<h3 style="margin-top:14px">'+esc(t(k))+'</h3>'+(j.items.length?j.items.map(matchCard).join(""):emptyS())).join("")}
  catch(e){errorS($("#list"),e,go)}};go();
},
async match(el,id,tab){
 el.innerHTML=loading();
 let m;try{m=await api("/matches/"+id)}catch(e){return errorS(el,e,()=>SCREENS.match(el,id,tab))}
 // three SH layouts with our own names; old saved keys from the first build are mapped across
 const VIEWS={pulse:["live","commentary","scorecard","info","fantasy","community","history","seriesstats","graphs"],
  classic:["scorecard","info","live","commentary","seriesstats","xi"],pro:["prediction","graphs","fantasy","h2h","live","scorecard","info"]};
 const DEF={pulse:m=>m.status==="live"?"live":m.status==="completed"?"scorecard":"info",classic:m=>m.status==="scheduled"?"info":"scorecard",pro:()=>"prediction"};
 const LBL={community:"mc.discussions",history:"mc.history",seriesstats:"ins.points_table"};
 const OLD={crex:"pulse",cricbuzz:"classic",sh:"pro"};let view=ls.get("shp_view")||"pulse";view=OLD[view]||view;if(!VIEWS[view])view="pulse";
 const tabs=VIEWS[view];document.body.dataset.mcview=view;
 const ALL=["info","weather","toss","pitch","h2h","prediction","xi","fantasy","live","scorecard","commentary","partnerships","fow","graphs","history","seriesstats","community","result"];
 const more=ALL.filter(k=>!tabs.includes(k)).map(k=>[k,LBL[k]||"mc."+k]);
 tab=tab||DEF[view](m);
 el.innerHTML='<p><a href="#/matches">← '+esc(t("nav.matches"))+'</a></p>'+(window.mcHeader?mcHeader(m):'')+'<div class="card"><h3>'+teamTxt(m.home,"c-home")+' <span class="muted">vs</span> '+teamTxt(m.away,"c-away")+origin(m.data_origin)+'</h3><div class="muted">'+esc(m.home.name)+' vs '+esc(m.away.name)+' · '+esc(m.competition)+' · '+esc(m.format)+' · '+when(m.start_utc)+'</div></div>'+
  '<div class="mc-views" role="group" aria-label="'+esc(t("mc.view"))+'">'+[["pulse","mc.view_pulse","⚡"],["classic","mc.view_classic","📋"],["pro","mc.view_pro","🎯"]].map(([k,l,i])=>'<button type="button" aria-pressed="'+(k===view)+'" class="'+(k===view?"on":"")+'" onclick="ls.set(\'shp_view\',\''+k+'\');(location.hash===\'#/match/'+id+'\'?route():location.hash=\'#/match/'+id+'\')">'+i+' '+esc(t(l))+'</button>').join("")+'</div>'+
  '<div class="sub mc-tabs" role="tablist">'+tabs.map(k=>'<a class="btn '+(k===tab?"on":"")+'" role="tab" aria-selected="'+(k===tab)+'" href="#/match/'+id+'/'+k+'">'+esc(t(LBL[k]||"mc."+k))+'</a>').join("")+
  '<select class="btn mc-more'+(tabs.includes(tab)?'':' on')+'" aria-label="'+esc(t("mc.more"))+'" onchange="if(this.value)location.hash=\'#/match/'+id+'/\'+this.value"><option value="">'+esc(t("mc.more"))+' ▾</option>'+more.map(([k,l])=>'<option value="'+k+'"'+(k===tab&&!tabs.includes(tab)?' selected':'')+'>'+esc(t(l))+'</option>').join("")+'</select></div><div id="tb">'+loading()+'</div>';
 const cur=document.querySelector('.sub .on');if(cur)cur.scrollIntoView({inline:"center",block:"nearest"});
 const tb=el.querySelector("#tb");const nm=tid=>tid===m.home.id?teamTxt(m.home,"c-home"):(tid===m.away.id?teamTxt(m.away,"c-away"):"—");
 const kv=pairs=>'<div class="card"><dl class="kv">'+pairs.map(([a,b])=>'<dt>'+esc(a)+'</dt><dd>'+b+'</dd>').join("")+'</dl></div>';
 const T={
  info:async()=>kv([[t("mc.status"),esc(m.status)],[t("mc.venue"),esc(m.venue||"—")],["Match",esc(m.match_no||"—")],["Format",esc(m.format)],["Source",'<span class="muted">'+esc(m.source)+'</span>']])+(m.attribution?'<p class="muted">'+esc(m.attribution.text)+' · <a href="'+esc(m.attribution.url)+'" rel="noopener" target="_blank">licence</a></p>':''),
  weather:async()=>m.weather?kv([[t("mc.weather"),esc(m.weather)]]):emptyS(t("mc.not_reported")),
  pitch:async()=>m.pitch_report?kv([[t("mc.pitch"),esc(m.pitch_report)]]):emptyS(t("mc.not_reported")),
  toss:async()=>m.toss_winner_id?kv([[t("col.toss"),nm(m.toss_winner_id)],["Decision",esc(m.toss_decision||"—")]])+'<p class="muted">'+esc(t("ai.toss_note"))+'</p>':emptyS(t("mc.not_reported")),
  h2h:async()=>kv([[t("mc.h2h"),m.head_to_head.matches+' · '+teamTxt(m.home,"c-home")+' '+m.head_to_head.home_won+' – '+m.head_to_head.away_won+' '+teamTxt(m.away,"c-away")],[t("mc.form"),teamTxt(m.home,"c-home")+' '+esc(m.form.home_last5||"—")+' · '+teamTxt(m.away,"c-away")+' '+esc(m.form.away_last5||"—")]]),
  prediction:async()=>{const [p,s]=await Promise.all([api("/matches/"+id+"/predictions"),api("/matches/"+id+"/signals")]);const pm=s.pre_match;
   return '<div class="card"><h3>SH AI</h3>'+probBar(pm.home_win_probability,m)+'<p class="muted">'+esc(t("ai.confidence"))+': '+esc(pm.confidence_level)+' · '+esc(t("ai.toss_note"))+'</p>'+factorsHtml(pm.public_factors)+'</div>'+
    (p.items.length?p.items.map(x=>'<div class="card"><h3>'+esc(x.prediction_type.replace(/_/g," "))+' · '+(x.predicted_team_id?nm(x.predicted_team_id):esc(x.predicted_value))+'</h3><div class="muted">'+esc(x.expert_name?x.expert_name+(x.expert_verified?" · "+t("exp.verified"):""):(x.model||"SH"))+' · '+esc(t("ai.confidence"))+': '+(x.confidence==null?"—":x.confidence+"%")+'</div>'+(x.public_note?'<p>'+esc(x.public_note)+'</p>':(x.explanation?'<p>'+esc(x.explanation)+'</p>':''))+'<dl class="kv"><dt>Locked</dt><dd>'+when(x.locked_at)+'</dd><dt>Result</dt><dd class="'+({correct:"o-won",incorrect:"o-lost"}[x.evaluation]||"o-unknown")+'">'+esc(x.evaluation||"pending")+'</dd></dl></div>').join(""):emptyS(t("mc.no_pred")))},
  community:async()=>{const j=await api("/matches/"+id+"/community");
   mcLater(()=>bindPosts($("#cp")));
   return '<div class="card"><h3>'+esc(t("so.sh_ai"))+'</h3>'+probBar(j.sh_ai.home_win_probability,m)+'<p class="muted">'+esc(j.note)+'</p></div>'+
    '<div class="card"><h3>'+esc(t("so.tipster_picks"))+'</h3>'+(j.tipster_picks.length?'<table class="simple"><tbody>'+j.tipster_picks.map(x=>'<tr><td><a href="#/u/'+esc(x.username)+'">'+esc(x.display_name)+'</a>'+(x.verified?' <span class="tag ver">Expert</span>':'')+'</td><td>'+esc(x.prediction_type)+': <b>'+esc(x.pick)+'</b></td><td class="muted">'+when(x.published_at)+'</td><td class="'+({correct:"o-won",incorrect:"o-lost"}[x.result]||"o-unknown")+'">'+esc(x.result||"pending")+'</td></tr>').join("")+'</tbody></table>':'<p class="muted">—</p>')+
    (j.verified_result?'<p>'+esc(t("mc.result"))+': <b>'+esc(j.verified_result.winner||j.verified_result.result_type)+'</b></p>':'')+'</div>'+
    '<p><a class="btn primary" href="#/compose">+ '+esc(t("so.compose"))+'</a></p><div id="cp">'+(j.posts.items.length?j.posts.items.map(postCard).join(""):emptyS())+'</div>'},

   d.innerHTML='<span>'+esc(t("app.updated"))+'</span><button type="button">'+esc(t("app.update_now"))+'</button>';d.querySelector("button").onclick=reload;document.body.appendChild(d);
   // reload by itself unless the user is in the middle of typing (then they tap the button)
   const go=()=>{if(!typing())reload();else setTimeout(go,4000)};setTimeout(go,2500)}}catch(e){}}
 setInterval(check,60000);document.addEventListener("visibilitychange",()=>{if(!document.hidden)check()});window.addEventListener("online",check)})();
