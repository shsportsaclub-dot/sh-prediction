<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SH PREDICTION</title><link rel="icon" type="image/svg+xml" href="/icon.svg"><meta name="theme-color" content="#091b38"><meta name="color-scheme" content="dark"><style>:root{color-scheme:dark}</style><style>body{background:#101827;color:#eaf0fa;font:16px system-ui;margin:0}header{padding:22px;background:#18263d}h1{margin:0;font-size:24px}.brand{display:flex;align-items:center;gap:12px}.brand img{width:58px;height:58px;border-radius:0;object-fit:contain}[hidden]{display:none!important}small{color:#a8b8d0}nav{display:flex;overflow:auto;gap:7px;padding:12px}button{border:0;border-radius:10px;background:#263a59;color:white;padding:12px;white-space:nowrap}button.active{background:#2379d5}main{padding:12px;max-width:900px;margin:auto}.item{padding:14px;background:#1a2941;border-radius:12px;margin:10px 0;overflow-wrap:anywhere}.empty{color:#a8b8d0;padding:30px;text-align:center}select{background:#263a59;color:white;padding:10px;border:0;border-radius:8px}canvas{width:100%;background:#152239;border-radius:10px}pre{white-space:pre-wrap}#launch{position:fixed;inset:0;z-index:9999;background:radial-gradient(ellipse at 50% 58%,#0b1930 0%,#030712 66%,#010308 100%);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:20px;overflow:hidden;transition:opacity .32s ease,visibility .32s ease}#launch.done{opacity:0;visibility:hidden;pointer-events:none}.launch-emblem{position:relative;width:min(58vw,235px);aspect-ratio:1;overflow:hidden;isolation:isolate;opacity:0;transform:scale(.86);animation:emblemIn .62s cubic-bezier(.16,1,.3,1) forwards}.launch-emblem img{display:block;width:100%;height:100%;object-fit:contain}.launch-emblem:after{content:"";position:absolute;inset:-35%;background:linear-gradient(108deg,transparent 43%,rgba(255,255,255,.02) 47%,rgba(255,255,255,.52) 50%,rgba(255,255,255,.02) 53%,transparent 57%);transform:translateX(-125%) rotate(-8deg);mix-blend-mode:screen;animation:chromeSweep .65s ease-out .45s both;pointer-events:none}#launch .launch-title{font-weight:850;letter-spacing:.19em;font-size:clamp(16px,4.2vw,24px);text-align:center;color:#e9edf5;opacity:0;transform:translateY(8px);animation:captionIn .42s ease-out .43s forwards}#launch .launch-line{width:110px;height:2px;background:linear-gradient(90deg,#b20b28 0%,#d9e0e9 50%,#1467d9 100%);transform:scaleX(0);animation:lineIn .5s ease-out .54s forwards}@keyframes emblemIn{to{opacity:1;transform:scale(1)}}@keyframes chromeSweep{to{transform:translateX(125%) rotate(-8deg)}}@keyframes captionIn{to{opacity:1;transform:translateY(0)}}@keyframes lineIn{to{transform:scaleX(1)}}@media(prefers-reduced-motion:reduce){.launch-emblem,#launch .launch-title,#launch .launch-line{animation:none;opacity:1;transform:none}.launch-emblem:after{display:none}#launch{transition:none}}</style><style id="premium-login">body{background:#050c1c;color:#f1f5ff}header{padding:14px 18px;background:#070f21;border-bottom:1px solid #253651}header .brand img{width:42px;height:42px;border-radius:0;object-fit:contain}header h1{font-size:19px;letter-spacing:.055em}header>small{display:none}#login{box-sizing:border-box;width:calc(100% - 28px);max-width:430px!important;margin:30px auto!important;padding:28px 22px!important;border:1px solid #283a57;border-radius:22px!important;background:linear-gradient(155deg,#132642 0%,#0b172e 55%,#090f20 100%)!important;box-shadow:0 18px 55px #0007}#login .brand{display:flex;flex-direction:column;gap:10px;text-align:center;margin-bottom:23px}#login .brand img{width:140px;height:140px;border-radius:0;object-fit:contain;filter:drop-shadow(0 9px 20px #0006)}#login h2{font-size:22px;margin:0;letter-spacing:.025em}#login p{color:#c5d2e6;font-size:14px;line-height:1.55;margin:14px 0}#login input{box-sizing:border-box;width:100%!important;display:block;background:#0a1428!important;border:1px solid #405371!important;border-radius:12px!important;color:#fff!important;font:16px system-ui;padding:15px!important;margin:12px 0!important;outline:none}#login input:focus{border-color:#5da7ff!important;box-shadow:0 0 0 3px #247de72a}#login button{display:block;width:100%;box-sizing:border-box;margin:12px 0;padding:15px 12px;border-radius:12px;font-size:15px;font-weight:700;background:linear-gradient(105deg,#b30d2c,#1a59bc);box-shadow:0 5px 18px #0005}#login #generate{background:#19365d;border:1px solid #315789}#login #otpdisplay{font-size:25px!important;letter-spacing:.22em!important;text-align:center;color:#cce6ff;overflow-wrap:anywhere}#login #loginmsg{text-align:center;color:#f7d2d2}#login>small{display:block;color:#8295b2;font-size:11px;line-height:1.45;text-align:center;margin-top:15px}@media(max-width:360px){#login{padding:22px 16px!important}#login h2{font-size:19px}}</style><iframe id="welcome-frame" src="/sh-prediction-welcome.html" title="SH PREDICTION welcome" style="position:fixed;inset:0;width:100%;height:100%;border:0;z-index:9999;background:#03050c"></iframe><header><div class="brand"><img src="/sh-prediction-icon.png" alt="SH PREDICTION logo"><h1>SH PREDICTION</h1></div><small>Independent cricket research • historical records • verified decimal odds</small></header><section id="login" style="max-width:460px;margin:30px auto;padding:22px;border-radius:16px;background:#1a2941"><div class="brand"><img src="/sh-prediction-icon.png" alt="SH PREDICTION logo"><h2>SH PREDICTION Login</h2></div><p>Enter mobile number to generate your on-screen code.</p><input id="phone" type="tel" inputmode="numeric" maxlength="15" placeholder="Mobile number" style="width:95%;padding:12px;margin-bottom:12px"><button id="generate">Generate OTP</button><div id="otpdisplay" style="font-size:28px;letter-spacing:6px;margin:16px 0"></div><input id="otp" inputmode="numeric" maxlength="6" placeholder="Enter 6-digit OTP" style="padding:12px"><button id="verify">Verify & Login</button><p id="loginmsg"></p><small>Convenience login only: the on-screen code does not verify phone ownership.</small></section><nav id="tabs" hidden></nav><main hidden><div id="content"></div></main><script>
const tabs=[["fixtures","Matches"],["results","Results"],["archive","Archive"],["predictions","Predictions"],["accuracy","Accuracy"]];let fixtures=[];
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
async function get(p){let r=await fetch(p,{headers:{"Authorization":"Bearer "+sessionToken}});if(!r.ok)throw Error("Request failed");return r.json()}
async function show(t){document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b.dataset.t===t));let el=document.getElementById("content");el.innerHTML='<div class="empty">Loading…</div>';try{
if(t==="matchcenter"){fixtures=await get("/fixtures");el.innerHTML='<button id="backmatches" onclick="show(\'fixtures\')">← Matches</button><h2>Match Center</h2><h3>Verified Decimal Odds Price</h3><p>No percentage conversion. No invented data.</p><select id="match"><option value="">Select match</option>'+fixtures.map(f=>'<option value="'+f.id+'">'+esc(f.home)+' vs '+esc(f.away)+'</option>').join("")+'</select><div id="plot" class="empty">Select a match</div>';document.getElementById("match").onchange=async e=>{let id=e.target.value;if(!id)return;let rows=await get("/odds?fixture_id="+encodeURIComponent(id));let box=document.getElementById("plot");if(!rows.length){box.textContent="No verified odds observations yet.";return}box.className="";box.innerHTML='<canvas id="chart" width="750" height="350"></canvas><p>'+rows.length+' verified observations</p>';draw(rows)};return}
let rows=await get("/"+t);if(t==="accuracy"){el.innerHTML='<div class="item">Toss: '+rows.toss.correct+' / '+rows.toss.total+'</div><div class="item">Match winner: '+rows.winner.correct+' / '+rows.winner.total+'</div>';return}
if(t==="fixtures"||t==="results"){el.innerHTML=rows.length?rows.map(r=>'<div class="item"><b>'+esc(r.home)+' vs '+esc(r.away)+'</b><p>'+esc(r.competition)+' • '+esc(r.season)+'</p><button class="openmatch" data-id="'+Number(r.id)+'">Match Center</button></div>').join(""):'<div class="empty">No verified matches yet.</div>';el.querySelectorAll(".openmatch").forEach(b=>b.onclick=()=>{show("matchcenter").then(()=>{let s=document.getElementById("match");if(s){s.value=b.dataset.id;s.dispatchEvent(new Event("change"))}})});return}
el.innerHTML=rows.length?rows.map(r=>'<div class="item">'+(t==="archive"?'<b>'+esc(r.section)+'</b><p>'+esc(r.source)+'</p>':t==="predictions"?'<b>Fixture #'+esc(r.fixture_id)+'</b><p>Toss: '+esc(r.toss_pick)+' • Winner: '+esc(r.winner_pick)+'</p>':'<b>'+esc(r.home)+' vs '+esc(r.away)+'</b><p>'+esc(r.competition)+' • '+esc(r.season)+'</p>'+(t==="results"?'<p>Winner: '+esc(r.match_winner)+'</p>':''))+'</div>').join(""):'<div class="empty">No verified records yet. Data is not fabricated.</div>'
}catch(e){el.textContent="Unable to load data: "+e.message}}
function draw(rows){let c=document.getElementById("chart"),x=c.getContext("2d"),W=c.width,H=c.height;x.clearRect(0,0,W,H);let teams=[...new Set(rows.map(r=>r.team))],values=rows.map(r=>Number(r.price)),min=Math.min(...values),max=Math.max(...values);if(min===max){min-=.1;max+=.1}let ts=rows.map(r=>Date.parse(r.observed_at)),lo=Math.min(...ts),hi=Math.max(...ts);x.strokeStyle="#70839d";x.beginPath();x.moveTo(60,20);x.lineTo(60,H-35);x.lineTo(W-20,H-35);x.stroke();x.fillStyle="#eaf0fa";x.font="14px system-ui";x.fillText(max.toFixed(2),8,28);x.fillText(min.toFixed(2),8,H-36);teams.forEach((team,i)=>{let color=["#5bd0ff","#ffbf69","#a9f69b"][i%3];x.strokeStyle=color;x.fillStyle=color;x.fillText(team,80+i*210,22);let pts=rows.filter(r=>r.team===team).sort((a,b)=>Date.parse(a.observed_at)-Date.parse(b.observed_at));x.beginPath();pts.forEach((r,j)=>{let X=60+(W-85)*(hi===lo?.5:(Date.parse(r.observed_at)-lo)/(hi-lo)),Y=20+(H-55)*(max-r.price)/(max-min);if(j===0)x.moveTo(X,Y);else x.lineTo(X,Y)});x.stroke();pts.forEach(r=>{let X=60+(W-85)*(hi===lo?.5:(Date.parse(r.observed_at)-lo)/(hi-lo)),Y=20+(H-55)*(max-r.price)/(max-min);x.beginPath();x.arc(X,Y,4,0,Math.PI*2);x.fill()})})}
document.getElementById("tabs").innerHTML=tabs.map(([k,v])=>'<button data-t="'+k+'">'+v+'</button>').join("");document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>show(b.dataset.t));let sessionToken=localStorage.getItem("shp_session")||"";
function enter(){document.getElementById("login").hidden=true;document.getElementById("tabs").hidden=false;document.querySelector("main").hidden=false;show("fixtures")}
async function post(path,data){let r=await fetch(path,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(data)});return {ok:r.ok,data:await r.json()}}
document.getElementById("generate").onclick=async()=>{let phone=document.getElementById("phone").value.trim();try{let r=await post("/auth/generate",{phone});document.getElementById("otpdisplay").textContent=r.data.otp||"";document.getElementById("loginmsg").textContent=r.ok?"Code valid for 5 minutes":r.data.error}catch(e){document.getElementById("loginmsg").textContent="Connection failed"}};
document.getElementById("verify").onclick=async()=>{try{let r=await post("/auth/verify",{phone:document.getElementById("phone").value.trim(),otp:document.getElementById("otp").value.trim()});if(r.ok&&r.data.token){sessionToken=r.data.token;localStorage.setItem("shp_session",sessionToken);enter()}else document.getElementById("loginmsg").textContent=r.data.error||"Verification failed"}catch(e){document.getElementById("loginmsg").textContent="Connection failed"}};
if(sessionToken){get("/fixtures").then(()=>enter()).catch(()=>{localStorage.removeItem("shp_session");sessionToken="";document.getElementById("login").hidden=false;});}
window.addEventListener("message",event=>{if(event.origin!==location.origin||event.source!==document.getElementById("welcome-frame")?.contentWindow||event.data?.type!=="sh-prediction-enter")return;document.getElementById("welcome-frame")?.remove()});
</script></html>
