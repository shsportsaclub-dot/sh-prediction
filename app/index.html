<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SH PREDICTION</title><style>body{background:#101827;color:#eaf0fa;font:16px system-ui;margin:0}header{padding:22px;background:#18263d}h1{margin:0;font-size:24px}small{color:#a8b8d0}nav{display:flex;overflow:auto;gap:7px;padding:12px}button{border:0;border-radius:10px;background:#263a59;color:white;padding:12px;white-space:nowrap}button.active{background:#2379d5}main{padding:12px;max-width:900px;margin:auto}.item{padding:14px;background:#1a2941;border-radius:12px;margin:10px 0;overflow-wrap:anywhere}.empty{color:#a8b8d0;padding:30px;text-align:center}select{background:#263a59;color:white;padding:10px;border:0;border-radius:8px}canvas{width:100%;background:#152239;border-radius:10px}pre{white-space:pre-wrap}</style><header><h1>SH PREDICTION</h1><small>Independent cricket research • historical records • verified decimal odds</small></header><section id="login" style="max-width:460px;margin:30px auto;padding:22px;border-radius:16px;background:#1a2941"><h2>SH PREDICTION Login</h2><p>Enter mobile number to generate your on-screen code.</p><input id="phone" type="tel" inputmode="numeric" maxlength="15" placeholder="Mobile number" style="width:95%;padding:12px;margin-bottom:12px"><button id="generate">Generate OTP</button><div id="otpdisplay" style="font-size:28px;letter-spacing:6px;margin:16px 0"></div><input id="otp" inputmode="numeric" maxlength="6" placeholder="Enter 6-digit OTP" style="padding:12px"><button id="verify">Verify & Login</button><p id="loginmsg"></p><small>Convenience login only: the on-screen code does not verify phone ownership.</small></section><nav id="tabs" hidden></nav><main hidden><div id="content"></div></main><script>
const tabs=[["fixtures","Matches"],["results","Results"],["archive","Archive"],["predictions","Predictions"],["accuracy","Accuracy"],["odds","Odds Price Graph"]];let fixtures=[];
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
async function get(p){let r=await fetch(p,{headers:{"Authorization":"Bearer "+sessionToken}});if(!r.ok)throw Error("Request failed");return r.json()}
async function show(t){document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b.dataset.t===t));let el=document.getElementById("content");el.innerHTML='<div class="empty">Loading…</div>';try{
if(t==="odds"){fixtures=await get("/fixtures");el.innerHTML='<h2>Verified Decimal Odds Price</h2><p>No percentage conversion. No invented data.</p><select id="match"><option value="">Select match</option>'+fixtures.map(f=>'<option value="'+f.id+'">'+esc(f.home)+' vs '+esc(f.away)+'</option>').join("")+'</select><div id="plot" class="empty">Select a match</div>';document.getElementById("match").onchange=async e=>{let id=e.target.value;if(!id)return;let rows=await get("/odds?fixture_id="+encodeURIComponent(id));let box=document.getElementById("plot");if(!rows.length){box.textContent="No verified odds observations yet.";return}box.className="";box.innerHTML='<canvas id="chart" width="750" height="350"></canvas><p>'+rows.length+' verified observations</p>';draw(rows)};return}
let rows=await get("/"+t);if(t==="accuracy"){el.innerHTML='<div class="item">Toss: '+rows.toss.correct+' / '+rows.toss.total+'</div><div class="item">Match winner: '+rows.winner.correct+' / '+rows.winner.total+'</div>';return}
el.innerHTML=rows.length?rows.map(r=>'<div class="item">'+(t==="archive"?'<b>'+esc(r.section)+'</b><p>'+esc(r.source)+'</p>':t==="predictions"?'<b>Fixture #'+esc(r.fixture_id)+'</b><p>Toss: '+esc(r.toss_pick)+' • Winner: '+esc(r.winner_pick)+'</p>':'<b>'+esc(r.home)+' vs '+esc(r.away)+'</b><p>'+esc(r.competition)+' • '+esc(r.season)+'</p>'+(t==="results"?'<p>Winner: '+esc(r.match_winner)+'</p>':''))+'</div>').join(""):'<div class="empty">No verified records yet. Data is not fabricated.</div>'
}catch(e){el.textContent="Unable to load data: "+e.message}}
function draw(rows){let c=document.getElementById("chart"),x=c.getContext("2d"),W=c.width,H=c.height;x.clearRect(0,0,W,H);let teams=[...new Set(rows.map(r=>r.team))],values=rows.map(r=>Number(r.price)),min=Math.min(...values),max=Math.max(...values);if(min===max){min-=.1;max+=.1}let ts=rows.map(r=>Date.parse(r.observed_at)),lo=Math.min(...ts),hi=Math.max(...ts);x.strokeStyle="#70839d";x.beginPath();x.moveTo(60,20);x.lineTo(60,H-35);x.lineTo(W-20,H-35);x.stroke();x.fillStyle="#eaf0fa";x.font="14px system-ui";x.fillText(max.toFixed(2),8,28);x.fillText(min.toFixed(2),8,H-36);teams.forEach((team,i)=>{let color=["#5bd0ff","#ffbf69","#a9f69b"][i%3];x.strokeStyle=color;x.fillStyle=color;x.fillText(team,80+i*210,22);let pts=rows.filter(r=>r.team===team).sort((a,b)=>Date.parse(a.observed_at)-Date.parse(b.observed_at));x.beginPath();pts.forEach((r,j)=>{let X=60+(W-85)*(hi===lo?.5:(Date.parse(r.observed_at)-lo)/(hi-lo)),Y=20+(H-55)*(max-r.price)/(max-min);if(j===0)x.moveTo(X,Y);else x.lineTo(X,Y)});x.stroke();pts.forEach(r=>{let X=60+(W-85)*(hi===lo?.5:(Date.parse(r.observed_at)-lo)/(hi-lo)),Y=20+(H-55)*(max-r.price)/(max-min);x.beginPath();x.arc(X,Y,4,0,Math.PI*2);x.fill()})})}
document.getElementById("tabs").innerHTML=tabs.map(([k,v])=>'<button data-t="'+k+'">'+v+'</button>').join("");document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>show(b.dataset.t));let sessionToken=sessionStorage.getItem("shp_session")||"";
function enter(){document.getElementById("login").hidden=true;document.getElementById("tabs").hidden=false;document.querySelector("main").hidden=false;show("fixtures")}
async function post(path,data){let r=await fetch(path,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(data)});return {ok:r.ok,data:await r.json()}}
document.getElementById("generate").onclick=async()=>{let phone=document.getElementById("phone").value.trim();try{let r=await post("/auth/generate",{phone});document.getElementById("otpdisplay").textContent=r.data.otp||"";document.getElementById("loginmsg").textContent=r.ok?"Code valid for 5 minutes":r.data.error}catch(e){document.getElementById("loginmsg").textContent="Connection failed"}};
document.getElementById("verify").onclick=async()=>{try{let r=await post("/auth/verify",{phone:document.getElementById("phone").value.trim(),otp:document.getElementById("otp").value.trim()});if(r.ok&&r.data.token){sessionToken=r.data.token;sessionStorage.setItem("shp_session",sessionToken);enter()}else document.getElementById("loginmsg").textContent=r.data.error||"Verification failed"}catch(e){document.getElementById("loginmsg").textContent="Connection failed"}};
if(sessionToken)enter();
</script></html>
