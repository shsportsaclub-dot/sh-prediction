<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SH PREDICTION</title><link rel="icon" type="image/svg+xml" href="/icon.svg"><meta name="theme-color" content="#091b38"><meta name="color-scheme" content="dark"><style>:root{color-scheme:dark}</style><style>body{background:#101827;color:#eaf0fa;font:16px system-ui;margin:0}header{padding:22px;background:#18263d}h1{margin:0;font-size:24px}.brand{display:flex;align-items:center;gap:12px}.brand img{width:58px;height:58px;border-radius:0;object-fit:contain}[hidden]{display:none!important}small{color:#a8b8d0}nav{display:flex;overflow:auto;gap:7px;padding:12px}button{border:0;border-radius:10px;background:#263a59;color:white;padding:12px;white-space:nowrap}button.active{background:#2379d5}main{padding:12px;max-width:900px;margin:auto}.item{padding:14px;background:#1a2941;border-radius:12px;margin:10px 0;overflow-wrap:anywhere}.empty{color:#a8b8d0;padding:30px;text-align:center}select{background:#263a59;color:white;padding:10px;border:0;border-radius:8px}canvas{width:100%;background:#152239;border-radius:10px}pre{white-space:pre-wrap}#launch{position:fixed;inset:0;z-index:9999;background:radial-gradient(ellipse at 50% 58%,#0b1930 0%,#030712 66%,#010308 100%);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:20px;overflow:hidden;transition:opacity .32s ease,visibility .32s ease}#launch.done{opacity:0;visibility:hidden;pointer-events:none}.launch-emblem{position:relative;width:min(58vw,235px);aspect-ratio:1;overflow:hidden;isolation:isolate;opacity:0;transform:scale(.86);animation:emblemIn .62s cubic-bezier(.16,1,.3,1) forwards}.launch-emblem img{display:block;width:100%;height:100%;object-fit:contain}.launch-emblem:after{content:"";position:absolute;inset:-35%;background:linear-gradient(108deg,transparent 43%,rgba(255,255,255,.02) 47%,rgba(255,255,255,.52) 50%,rgba(255,255,255,.02) 53%,transparent 57%);transform:translateX(-125%) rotate(-8deg);mix-blend-mode:screen;animation:chromeSweep .65s ease-out .45s both;pointer-events:none}#launch .launch-title{font-weight:850;letter-spacing:.19em;font-size:clamp(16px,4.2vw,24px);text-align:center;color:#e9edf5;opacity:0;transform:translateY(8px);animation:captionIn .42s ease-out .43s forwards}#launch .launch-line{width:110px;height:2px;background:linear-gradient(90deg,#b20b28 0%,#d9e0e9 50%,#1467d9 100%);transform:scaleX(0);animation:lineIn .5s ease-out .54s forwards}@keyframes emblemIn{to{opacity:1;transform:scale(1)}}@keyframes chromeSweep{to{transform:translateX(125%) rotate(-8deg)}}@keyframes captionIn{to{opacity:1;transform:translateY(0)}}@keyframes lineIn{to{transform:scaleX(1)}}@media(prefers-reduced-motion:reduce){.launch-emblem,#launch .launch-title,#launch .launch-line{animation:none;opacity:1;transform:none}.launch-emblem:after{display:none}#launch{transition:none}}</style><style id="premium-login">body{background:#050c1c;color:#f1f5ff}header{padding:14px 18px;background:#070f21;border-bottom:1px solid #253651}header .brand img{width:42px;height:42px;border-radius:0;object-fit:contain}header h1{font-size:19px;letter-spacing:.055em}header>small{display:none}#login{box-sizing:border-box;width:calc(100% - 28px);max-width:430px!important;margin:30px auto!important;padding:28px 22px!important;border:1px solid #283a57;border-radius:22px!important;background:linear-gradient(155deg,#132642 0%,#0b172e 55%,#090f20 100%)!important;box-shadow:0 18px 55px #0007}#login .brand{display:flex;flex-direction:column;gap:10px;text-align:center;margin-bottom:23px}#login .brand img{width:140px;height:140px;border-radius:0;object-fit:contain;filter:drop-shadow(0 9px 20px #0006)}#login h2{font-size:22px;margin:0;letter-spacing:.025em}#login p{color:#c5d2e6;font-size:14px;line-height:1.55;margin:14px 0}#login input{box-sizing:border-box;width:100%!important;display:block;background:#0a1428!important;border:1px solid #405371!important;border-radius:12px!important;color:#fff!important;font:16px system-ui;padding:15px!important;margin:12px 0!important;outline:none}#login input:focus{border-color:#5da7ff!important;box-shadow:0 0 0 3px #247de72a}#login button{display:block;width:100%;box-sizing:border-box;margin:12px 0;padding:15px 12px;border-radius:12px;font-size:15px;font-weight:700;background:linear-gradient(105deg,#b30d2c,#1a59bc);box-shadow:0 5px 18px #0005}#login #generate{background:#19365d;border:1px solid #315789}#login #otpdisplay{font-size:25px!important;letter-spacing:.22em!important;text-align:center;color:#cce6ff;overflow-wrap:anywhere}#login #loginmsg{text-align:center;color:#f7d2d2}#login>small{display:block;color:#8295b2;font-size:11px;line-height:1.45;text-align:center;margin-top:15px}@media(max-width:360px){#login{padding:22px 16px!important}#login h2{font-size:19px}}</style><iframe id="welcome-frame" src="/sh-prediction-welcome.html" title="SH PREDICTION welcome" style="position:fixed;inset:0;width:100%;height:100%;border:0;z-index:9999;background:#03050c"></iframe><header><div class="brand"><img src="/sh-prediction-icon.png" alt="SH PREDICTION logo"><h1>SH PREDICTION</h1></div><small>Independent cricket research • historical records • verified decimal odds</small></header><section id="login" style="max-width:460px;margin:30px auto;padding:22px;border-radius:16px;background:#1a2941"><div class="brand"><img src="/sh-prediction-icon.png" alt="SH PREDICTION logo"><h2>SH PREDICTION Login</h2></div><p>Enter mobile number to generate your on-screen code.</p><input id="phone" type="tel" inputmode="numeric" maxlength="15" placeholder="Mobile number" style="width:95%;padding:12px;margin-bottom:12px"><button id="generate">Generate OTP</button><div id="otpdisplay" style="font-size:28px;letter-spacing:6px;margin:16px 0"></div><input id="otp" inputmode="numeric" maxlength="6" placeholder="Enter 6-digit OTP" style="padding:12px"><button id="verify">Verify & Login</button><p id="loginmsg"></p><small>Convenience login only: the on-screen code does not verify phone ownership.</small></section><style id="mc">
#app{max-width:1060px;margin:auto;padding:14px}
.switch{display:grid;grid-template-columns:1fr 1fr;background:#111f38;padding:5px;border-radius:15px;gap:5px;margin-bottom:14px}
#app button{cursor:pointer;background:#172843;color:#cbd8ec;border:1px solid #344765;padding:11px 15px;border-radius:10px;font-weight:650;font-size:15px}
#app button.active{background:linear-gradient(110deg,#b91837,#2458b9);border-color:transparent;color:#fff}
.nav,.subnav{display:flex;overflow:auto;gap:8px;padding:8px 0;scrollbar-width:thin}.nav button,.subnav button{flex-shrink:0}
.panel{background:linear-gradient(145deg,#142541,#0b162c);border:1px solid #2c4162;border-radius:18px;padding:16px;margin-top:10px}
.panel h2{margin:0 0 6px;font-size:22px}.muted{color:#a5b5cc;font-size:14px;line-height:1.5}
.card{background:#0c1a31;border:1px solid #263c5a;border-radius:14px;padding:14px;margin-top:10px;overflow-wrap:anywhere}
.card h3{margin:0 0 6px;font-size:17px}.empty{text-align:center;padding:30px 14px;border:1px dashed #3b506c;border-radius:12px;color:#b3c2d8;margin-top:10px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}.kv b{color:#9fb4d6;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.stat{background:#0c1a31;border:1px solid #263c5a;border-radius:12px;padding:12px;text-align:center}.stat b{display:block;font-size:24px}
.badge{display:inline-block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:99px;background:#1d3a66;color:#cfe3ff;margin-left:6px}
pre.pl{white-space:pre-wrap;margin:8px 0 0;font:12px/1.5 ui-monospace,monospace;color:#d6e2f5;max-height:320px;overflow:auto}
#app select{width:100%;max-width:100%}
</style>
<div id="app" hidden><div class="switch" id="sports"><button data-sp="CRICKET" class="active">CRICKET</button><button data-sp="WORLD">WORLD</button></div><div class="nav" id="nav"></div><section class="panel"><h2 id="title"></h2><p class="muted" id="desc"></p><div id="body"></div></section></div>
<script>
const PAGES=["Home","Matches","Series","Teams","Players","Rankings","Archive","Predictions","Accuracy","More"];
const MC=["Overview","Live","Scorecard","Commentary","Playing XI","Toss","Pitch","Weather","Head to Head","Prediction","Win Probability","Partnerships","Wickets","Graphs","Odds Price History","Records","Match Info"];
const ARCH={"Scorecard":"scorecard","Commentary":"commentary_summary","Records":"stats","Match Info":"match_info"};
const DESC={Home:"Overview of verified records in SH PREDICTION.",Matches:"Open a match to see its 17-section Match Centre.",Series:"Competitions and seasons from verified fixtures.",Teams:"Teams from verified fixtures.",Players:"Player profiles appear when an authorized source is connected.",Rankings:"Rankings appear when an authorized source is connected.",Archive:"Reviewed archive records with their sources.",Predictions:"Approved pre-match predictions only.",Accuracy:"Approved predictions compared with verified outcomes.",More:"Account and data policy."};
let sport="CRICKET",page="Home",openId=null,tab="Overview",D={fx:[],res:[],pred:[],arch:[]},sessionToken=localStorage.getItem("shp_session")||"";
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
async function get(p){let r=await fetch(p,{headers:{"Authorization":"Bearer "+sessionToken}});if(!r.ok)throw Error("Request failed");return r.json()}
async function post(path,data){let r=await fetch(path,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(data)});return {ok:r.ok,data:await r.json()}}
const empty=t=>'<div class="empty">'+esc(t||"No verified data yet")+'</div>';
const fxName=id=>{let f=D.fx.find(x=>x.id==id);return f?f.home+" vs "+f.away:"Fixture #"+id};
const when=u=>{let d=new Date(u);return isNaN(d)?esc(u):esc(d.toLocaleString())};
async function load(){const [a,b,c,d]=await Promise.all([get("/fixtures"),get("/results"),get("/predictions"),get("/archive")]);D={fx:a,res:b,pred:c,arch:d}}
function nav(){document.querySelectorAll("#sports button").forEach(b=>b.classList.toggle("active",b.dataset.sp===sport));$("nav").innerHTML=PAGES.map(p=>'<button data-p="'+p+'" class="'+(p===page?"active":"")+'">'+p+'</button>').join("");document.querySelectorAll("#nav button").forEach(b=>b.onclick=()=>{page=b.dataset.p;openId=null;render()})}
function fxCard(f,extra){return '<div class="card"><h3>'+esc(f.home)+' vs '+esc(f.away)+'</h3><div class="muted">'+esc(f.competition)+' • '+esc(f.season)+' • '+when(f.start_utc)+'</div>'+(extra||"")+'<p><button class="open" data-id="'+Number(f.id)+'">Match Centre</button></p></div>'}
function bindOpen(){document.querySelectorAll("#body .open").forEach(b=>b.onclick=()=>{openId=Number(b.dataset.id);page="Matches";tab="Overview";render()})}
async function matchCentre(){const f=D.fx.find(x=>x.id==openId);if(!f){openId=null;return render()}
let h='<button id="back">← Matches</button><div class="card"><h3>'+esc(f.home)+' vs '+esc(f.away)+'</h3><div class="muted">'+esc(f.competition)+' • '+esc(f.season)+'</div></div><div class="subnav">'+MC.map(t=>'<button data-t="'+t+'" class="'+(t===tab?"active":"")+'">'+t+'</button>').join("")+'</div><div id="tabbody"></div>';
$("body").innerHTML=h;$("back").onclick=()=>{openId=null;render()};document.querySelectorAll(".subnav button").forEach(b=>b.onclick=()=>{tab=b.dataset.t;matchCentre()});
const tb=$("tabbody"),res=D.res.find(x=>x.id==f.id),pr=D.pred.find(x=>x.fixture_id==f.id);
if(tab==="Overview"){tb.innerHTML='<div class="card"><div class="kv"><b>Start</b><span>'+when(f.start_utc)+'</span><b>Status</b><span>'+(res?"Result verified":"No verified result")+'</span>'+(res&&res.match_winner?'<b>Winner</b><span>'+esc(res.match_winner)+'</span>':'')+'<b>Source</b><span>'+esc(f.source)+'</span></div></div>';return}
if(tab==="Toss"){tb.innerHTML=(res&&res.toss_winner)?'<div class="card"><div class="kv"><b>Toss winner</b><span>'+esc(res.toss_winner)+'</span><b>Status</b><span>Verified outcome</span></div></div>':empty("No verified toss result yet");if(pr&&pr.toss_pick)tb.innerHTML+='<div class="card"><h3>Toss prediction<span class="badge">approved</span></h3>'+esc(pr.toss_pick)+'</div>';return}
if(tab==="Prediction"){tb.innerHTML=pr?'<div class="card"><h3>Approved prediction</h3><div class="kv"><b>Toss</b><span>'+esc(pr.toss_pick||"—")+'</span><b>Winner</b><span>'+esc(pr.winner_pick||"—")+'</span></div></div>':empty("No approved prediction for this match");return}
if(tab==="Win Probability"){tb.innerHTML=empty("Not available: no authorized probability source is connected");return}
if(tab==="Odds Price History"){tb.innerHTML='<div class="empty">Loading…</div>';try{let rows=await get("/odds?fixture_id="+encodeURIComponent(f.id));if(!rows.length){tb.innerHTML=empty("No verified odds observations yet");return}tb.innerHTML='<div class="card"><canvas id="chart" width="750" height="350" style="width:100%;background:#152239;border-radius:10px"></canvas><p class="muted">'+rows.length+' verified decimal-odds observations. No percentage conversion.</p></div>';draw(rows)}catch(e){tb.innerHTML=empty("Unable to load odds")}return}
const sec=ARCH[tab];if(sec){let rows=D.arch.filter(a=>a.fixture_id==f.id&&a.section===sec);tb.innerHTML=rows.length?rows.map(a=>{let p;try{p=JSON.stringify(JSON.parse(a.payload),null,2)}catch(e){p=a.payload}return '<div class="card"><h3>'+esc(tab)+'<span class="badge">reviewed</span></h3><pre class="pl">'+esc(p)+'</pre><div class="muted">Source: '+esc(a.source)+'</div></div>'}).join(""):empty();return}
tb.innerHTML=empty()}
function render(){nav();$("title").textContent=sport==="WORLD"?"World Sports Hub":page;$("desc").textContent=sport==="WORLD"?"":(DESC[page]||"");const b=$("body");
if(sport==="WORLD"){b.innerHTML=empty("World sports content is not connected yet");return}
if(openId){matchCentre();return}
if(page==="Home"){let ap=D.pred.length,ac=0,tot=0;b.innerHTML='<div class="grid"><div class="stat"><b>'+D.fx.length+'</b>Matches</div><div class="stat"><b>'+D.res.length+'</b>Results</div><div class="stat"><b>'+ap+'</b>Approved predictions</div><div class="stat"><b>'+D.arch.length+'</b>Archive records</div></div>'+(D.fx.length?'':empty("No verified matches yet. Data is not fabricated."));return}
if(page==="Matches"){b.innerHTML=D.fx.length?D.fx.map(f=>fxCard(f)).join(""):empty("No verified matches yet");bindOpen();return}
if(page==="Series"){let m={};D.fx.forEach(f=>{let k=f.competition+" • "+f.season;(m[k]=m[k]||[]).push(f)});b.innerHTML=Object.keys(m).length?Object.entries(m).map(([k,v])=>'<div class="card"><h3>'+esc(k)+'</h3><div class="muted">'+v.length+' match'+(v.length>1?"es":"")+'</div>'+v.map(f=>'<p>'+esc(f.home)+' vs '+esc(f.away)+' <button class="open" data-id="'+Number(f.id)+'">Open</button></p>').join("")+'</div>').join(""):empty();bindOpen();return}
if(page==="Teams"){let t=[...new Set(D.fx.flatMap(f=>[f.home,f.away]))].sort();b.innerHTML=t.length?t.map(n=>'<div class="card"><h3>'+esc(n)+'</h3>'+D.fx.filter(f=>f.home===n||f.away===n).map(f=>'<p>'+esc(f.home)+' vs '+esc(f.away)+' <button class="open" data-id="'+Number(f.id)+'">Open</button></p>').join("")+'</div>').join(""):empty();bindOpen();return}
if(page==="Archive"){b.innerHTML=D.arch.length?D.arch.map(a=>'<div class="card"><h3>'+esc(a.section)+'</h3><div class="muted">'+(a.fixture_id?esc(fxName(a.fixture_id))+' • ':"")+esc(a.source)+'</div></div>').join(""):empty();return}
if(page==="Predictions"){b.innerHTML=D.pred.length?D.pred.map(p=>'<div class="card"><h3>'+esc(fxName(p.fixture_id))+'</h3><div class="kv"><b>Toss</b><span>'+esc(p.toss_pick||"—")+'</span><b>Winner</b><span>'+esc(p.winner_pick||"—")+'</span></div></div>').join(""):empty("No approved predictions yet");return}
if(page==="Accuracy"){b.innerHTML='<div class="empty">Loading…</div>';get("/accuracy").then(r=>{b.innerHTML='<div class="grid"><div class="stat"><b>'+r.toss.correct+' / '+r.toss.total+'</b>Toss</div><div class="stat"><b>'+r.winner.correct+' / '+r.winner.total+'</b>Match winner</div></div>'}).catch(()=>b.innerHTML=empty("Unable to load accuracy"));return}
if(page==="More"){b.innerHTML='<div class="card"><h3>Data policy</h3><p class="muted">SH PREDICTION shows only verified, reviewed or user-supplied records, each with its source. No scores, probabilities or odds are invented.</p></div><div class="card"><button id="logout">Log out</button></div>';$("logout").onclick=async()=>{try{await fetch("/auth/logout",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+sessionToken},body:"{}"})}catch(e){}localStorage.removeItem("shp_session");location.reload()};return}
b.innerHTML=empty(sport==="CRICKET"?"No verified data yet":"")}
function draw(rows){let c=document.getElementById("chart"),x=c.getContext("2d"),W=c.width,H=c.height;x.clearRect(0,0,W,H);let teams=[...new Set(rows.map(r=>r.team))],values=rows.map(r=>Number(r.price)),min=Math.min(...values),max=Math.max(...values);if(min===max){min-=.1;max+=.1}let ts=rows.map(r=>Date.parse(r.observed_at)),lo=Math.min(...ts),hi=Math.max(...ts);x.strokeStyle="#70839d";x.beginPath();x.moveTo(60,20);x.lineTo(60,H-35);x.lineTo(W-20,H-35);x.stroke();x.fillStyle="#eaf0fa";x.font="14px system-ui";x.fillText(max.toFixed(2),8,28);x.fillText(min.toFixed(2),8,H-36);teams.forEach((team,i)=>{let color=["#5bd0ff","#ffbf69","#a9f69b"][i%3];x.strokeStyle=color;x.fillStyle=color;x.fillText(team,80+i*210,22);let pts=rows.filter(r=>r.team===team).sort((a,b)=>Date.parse(a.observed_at)-Date.parse(b.observed_at));x.beginPath();pts.forEach((r,j)=>{let X=60+(W-85)*(hi===lo?.5:(Date.parse(r.observed_at)-lo)/(hi-lo)),Y=20+(H-55)*(max-r.price)/(max-min);if(j===0)x.moveTo(X,Y);else x.lineTo(X,Y)});x.stroke();pts.forEach(r=>{let X=60+(W-85)*(hi===lo?.5:(Date.parse(r.observed_at)-lo)/(hi-lo)),Y=20+(H-55)*(max-r.price)/(max-min);x.beginPath();x.arc(X,Y,4,0,Math.PI*2);x.fill()})})}
document.querySelectorAll("#sports button").forEach(b=>b.onclick=()=>{sport=b.dataset.sp;openId=null;page=sport==="CRICKET"?"Home":"Matches";render()});
async function enter(){document.getElementById("login").hidden=true;$("app").hidden=false;try{await load()}catch(e){}render()}
document.getElementById("generate").onclick=async()=>{let phone=document.getElementById("phone").value.trim();try{let r=await post("/auth/generate",{phone});document.getElementById("otpdisplay").textContent=r.data.otp||"";document.getElementById("loginmsg").textContent=r.ok?"Code valid for 5 minutes":r.data.error}catch(e){document.getElementById("loginmsg").textContent="Connection failed"}};
document.getElementById("verify").onclick=async()=>{try{let r=await post("/auth/verify",{phone:document.getElementById("phone").value.trim(),otp:document.getElementById("otp").value.trim()});if(r.ok&&r.data.token){sessionToken=r.data.token;localStorage.setItem("shp_session",sessionToken);enter()}else document.getElementById("loginmsg").textContent=r.data.error||"Verification failed"}catch(e){document.getElementById("loginmsg").textContent="Connection failed"}};
if(sessionToken){get("/fixtures").then(()=>enter()).catch(()=>{localStorage.removeItem("shp_session");sessionToken="";document.getElementById("login").hidden=false;});}
window.addEventListener("message",event=>{if(event.origin!==location.origin||event.source!==document.getElementById("welcome-frame")?.contentWindow||event.data?.type!=="sh-prediction-enter")return;document.getElementById("welcome-frame")?.remove()});
</script></html>
