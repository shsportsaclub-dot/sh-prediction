name: Keep SH Prediction awake
# Render's free instance sleeps after ~15 minutes without visitors. While asleep the background jobs
# (sheets, CricketData, live loop) stop, and on waking the server starts from an empty database.
# A light /health request every few minutes keeps it running so updates continue on their own.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping SH Prediction and SH Data Line
        run: |
          for u in https://sh-prediction.onrender.com/health https://sh-data-line.onrender.com/health; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 90 "$u" || true)
            echo "$u -> $code"
          done
