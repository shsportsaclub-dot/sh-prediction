name: SH Prediction Server Tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    env:
      SH_COLLECTORS: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Video test runtime
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
      - name: Compile server and tests
        run: python -m compileall -q app tests
      - name: Schedule client behaviour
        run: |
          node tests/fixture_schedule_view_test.cjs
          node tests/match_info_timezone_test.cjs
      - name: Full server regression
        run: |
          set -o pipefail
          timeout --signal=SIGABRT --kill-after=10s 180s python -u -X faulthandler -m unittest discover -s tests -v 2>&1 | tee server-test-results.txt
      - name: Publish test summary
        if: always()
        run: |
          echo '## SH Prediction server regression' >> "$GITHUB_STEP_SUMMARY"
          echo 'These checks do not certify production source-to-consumer acquisition.' >> "$GITHUB_STEP_SUMMARY"
          if [ -f server-test-results.txt ]; then
            grep -E '^Ran [0-9]+ tests|^OK$|^FAILED|^ERROR:|^FAIL:' server-test-results.txt >> "$GITHUB_STEP_SUMMARY" || true
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sh-prediction-server-test-log
          path: server-test-results.txt
          if-no-files-found: ignore

